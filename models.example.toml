# Per-backend model settings. Copy to models.toml to activate.
# models.toml is gitignored; this example is committed.
#
# Model-selection knobs only (which model / how much thinking / effort /
# provider). Operational settings (bin, cwd, permission_mode, tools, ...) stay
# in config.toml. Each backend reads its own [<backend>] section and maps the
# conventional keys to its CLI/API; keys a backend doesn't use are ignored.
#
# Conventional keys: model / thinking / effort / provider.
# Applied on process start, or live via Settings → Backend/model settings
# (設定 → バックエンド/モデル設定…), which rewrites the model/provider keys here +
# [backend].name / [claude_code].bin in config.toml and refreshes the cache — no
# restart needed.

[claude_code]
# Reuses the VS Code Claude Code engine (stream-json mode).
model    = "opus"     # --model  ("opus"/"sonnet" alias or full name; empty = ~/.claude default)
thinking = "enabled"  # --thinking: enabled | adaptive | disabled  (empty = CLI default; true/false also accepted)
effort   = "xhigh"    # --effort: low | medium | high | xhigh | max | ultracode  (empty = CLI default)
                      #   ultracode => --effort xhigh --settings '{"ultracode": true}'
                      #   (high token use; needs an ultracode-capable model)

[pi]
provider = "openai-codex"  # --provider  (openai-codex | github-copilot | llama.cpp)
model    = "gpt-6.1-sol"   # --model
# *_choices は「バックエンド/モデル設定」ダイアログのドロップダウン候補。
# ダイアログの「追加」「削除」が書き換えるので手編集は不要 (してもよい)。キー自体が無ければ
# engines.py の既定の種を出し、[] なら「候補なし」として尊重する。
# ローカルモデルは llama-server にロード済みのものしか pi の catalog に出ないため、
# 名前をここに貯めておくのが実質的な使い方。
# model_choices    = ["gpt-6.1-sol", "gpt-6-sol"]
# provider_choices = ["openai-codex", "llama.cpp"]

[codex]
model  = ""     # --model (empty = codex default; 候補は ChatGPT 側 Codex カタログ)
effort = ""     # -c model_reasoning_effort: low | medium | high | xhigh | max (使える値はモデルによる)
                #   (empty = default; 値は無検証でそのまま渡す)

[openai-compat]
model    = ""   # request model name (empty = OPENAI_MODEL env, then gpt-4o-mini)
                #   OPENAI_BASE_URL / OPENAI_API_KEY stay in .env (endpoint/secret).
