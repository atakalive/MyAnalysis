# LLM backend configuration. Copy to config.toml to activate.
# config.toml is gitignored; this example is committed.
# View → backend/model settings rewrites [backend].name and [claude_code].bin
# here (and the model/provider keys in models.toml) and applies without a restart.

[backend]
name = "pi"          # "claude" | "pi" | "codex" | "openai" | "mock"

[pi]
# ★ Windows パスは TOML basic 文字列だと \ がエスケープされる。
#   前方スラッシュか、リテラル文字列 '...' を使うこと。
cwd  = '<repo>'   # 省略時はリポジトリ root
bin  = "pi"          # 実行ファイル(PATH 名 or 絶対パス)
# model / provider はモデル設定なので models.toml の [pi] で指定(models.example.toml 参照)
tools = ""           # --tools 許可リスト(空=全ツール=フラグ省略,
                     #   "read,write"=許可リスト, "none"=--no-tools)

[codex]
# OpenAI Codex CLI (npm i -g @openai/codex)。認証は ~/.codex を共有 (codex login)。
# 1 ターン = 1 `codex exec --json`、2 ターン目以降は `codex exec resume <thread_id>`。
bin = ""             # 実行ファイル(空 = env CODEX_BIN → PATH の "codex" の順で解決。
                     #   非空にするとその値が最優先で CODEX_BIN は無視される)
# 空(既定) = --dangerously-bypass-approvals-and-sandbox で無人実行。
#   GUI 駆動 (python -m llm_bridge) とデータセット work_dir への書込を
#   サンドボックス外で走らせるために必要 (claude の bypassPermissions 相当)。
#   絞る場合は codex の OS サンドボックスを選択(書込先がサンドボックスに制限される):
sandbox_mode = ""    # "" | "read-only" | "workspace-write" | "danger-full-access"
# model / effort はモデル設定なので models.toml の [codex] で指定
# cwd 省略 → ~/.myanalysis/codex_home(リポジトリ外)。MyAnalysis の指示を注入する
#   AGENTS.md をこのディレクトリに自動生成・上書きする(手書きの AGENTS.md を
#   置かないこと)。claude の agent_home とは分離してある。
# cwd = '...'

[claude_code]
# Reuses the VS Code Claude Code extension's bundled engine (the `claude`
# binary under ~/.vscode/extensions/anthropic.claude-code-*/resources/
# native-binary/). Shares your VS Code login/sessions via ~/.claude.
# Driven in stream-json mode (NOT `claude -p`), with multi-turn --resume.
bin = ""             # 省略時は VS Code 拡張同梱バイナリを自動検出
                     #   (env CLAUDE_CODE_BIN でも上書き可)
# model / thinking / effort はモデル設定なので models.toml の [claude_code] で指定
#   (models.example.toml 参照)
permission_mode = "bypassPermissions"
                     # default|acceptEdits|plan|bypassPermissions
                     # GUI 駆動(Bash で python -m llm_bridge)を無人実行するため
                     #   既定は bypassPermissions。絞るなら allowed_tools も設定。
allowed_tools = ""   # 任意 --allowedTools 許可リスト(空白/カンマ区切り)
# true(既定)= CC 同梱エンジンの既定システムプロンプトに MyAnalysis の指示を追記。
# false     = CC 既定を使わず MyAnalysis の指示のみをシステムプロンプトにする
#             (provider の押し付けプロンプトを無効化)。GUI: 設定メニューでも切替可。
use_provider_system_prompt = true
# cwd 省略 → ~/.myanalysis/agent_home(リポジトリ外)。
#   リポジトリ直下を cwd にすると開発者向け CLAUDE.md を読み込み「アプリ開発役」に
#   なってしまうため、既定では外に出して「データ解析役」に保つ。リポジトリ自体は
#   --add-dir + PYTHONPATH で参照可能。明示上書きしたい場合のみ↓を有効化:
# cwd = '<repo>'

# ── Visual feedback (Observe self-view) ──
# 図の self-view には次のいずれかが必要:
#   (a) models.toml の [claude_code].model に vision 対応モデルを指定する
#   (b) pi-vision-proxy を導入し PI_VISION_PROXY_MODEL を設定する
# read ツールを無効化しないこと (画像視認に必要。tools="" で全許可=既定)。
