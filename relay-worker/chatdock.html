<!DOCTYPE html>
<!--
  MyAnalysis meeting guest client (Issue #42). Single file, pure fetch, zero deps.
  Served by meeting/local_relay.py at GET / (and mirrored to GitLab Pages).
  Strings carry a minimal ja/en switch in-file (the Python i18n catalog is not
  shipped to guests). Since the dataset layer (Issue #51 follow-up) the wire
  format diverged from relay-worker/worker.js — worker.js documents the pre-DS
  protocol only; meeting/local_relay.py is the live server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAnalysis — meeting</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
  #enter { max-width: 460px; margin: 8vh auto; padding: 24px; background: #252526; border-radius: 8px; }
  #enter h1 { font-size: 18px; margin: 0 0 16px; }
  #enter input { width: 100%; padding: 8px; margin: 6px 0 14px; background: #1e1e1e; color: #ddd;
                 border: 1px solid #444; border-radius: 4px; font-size: 14px; }
  button { background: #0e639c; color: #fff; border: none; padding: 8px 14px; border-radius: 4px;
           cursor: pointer; font-size: 13px; }
  button:hover { background: #1177bb; }
  button:disabled { background: #444; color: #888; cursor: default; }
  .err { color: #f48771; font-size: 13px; margin: 8px 0; }
  #app { display: none; height: 100vh; }
  #cols { display: flex; height: 100%; --right-w: 380px; }
  #left { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; }
  #splitter { flex: none; width: 6px; cursor: col-resize; background: #333;
              border-left: 1px solid #1e1e1e; border-right: 1px solid #1e1e1e; }
  #splitter:hover, #splitter.dragging { background: #0e639c; }
  body.resizing { cursor: col-resize; user-select: none; }
  #right { flex: none; width: var(--right-w); min-width: 220px; max-width: 70vw;
           display: flex; flex-direction: column; }
  .bar { display: flex; gap: 4px; padding: 6px; background: #252526; flex-wrap: wrap; align-items: center; }
  .tabbtn { background: #333; padding: 4px 10px; font-size: 12px; }
  .tabbtn.active { background: #0e639c; }
  .followtoggle { margin-left: auto; background: #3a3d41; border: 1px solid #5a5d61;
                  padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .followtoggle:hover { background: #45494e; }
  .followtoggle.on { background: #2d7d46; border-color: #3fa860; color: #fff; }
  .followtoggle.on:hover { background: #348a4f; }
  /* DS layer above the tab bar — clickable chips mirroring the host's
     DatasetSwitcher. curDs is guest-local: each guest navigates on their own by
     default (Issue #78) and only tracks the host's active dataset while the opt-in
     "Follow host" toggle is on (Issue #80). Chips are .tabbtn buttons; the ◆ prefix
     (added via textContent) mirrors the host's DS tab label (#57). #followToggle is
     a permanent child of #dsBar, pushed to the right edge by margin-left:auto. */
  #dsBar { border-bottom: 1px solid #333; }
  .viewempty { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; color: #888; font-size: 13px;
               font-style: italic; pointer-events: none; }
  select.tabbtn { color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .ctxmenu { position: fixed; z-index: 1000; background: #252526; border: 1px solid #454545;
             border-radius: 4px; padding: 4px 0; min-width: 160px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .ctxitem { padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .ctxitem:hover { background: #0e639c; }
  #canvaswrap { flex: 1; overflow: hidden; position: relative; background: #111; }
  #view { position: absolute; top: 0; left: 0; max-width: 100%; max-height: 100%;
          width: auto; height: auto; object-fit: contain;
          transform-origin: 0 0; image-rendering: auto; }
  #chatlog { flex: 1; overflow-y: auto; padding: 8px; font-size: 13px; }
  .msg { margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: #2a2d2e; white-space: pre-wrap;
         word-break: break-word; }
  /* Markdown コンテナ（assistant 確定本文）。親 .msg の pre-wrap を解除し、要素スタイルを与える。 */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 6px 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 8px 0 4px; line-height: 1.25; }
  .md h1 { font-size: 1.5em; } .md h2 { font-size: 1.35em; } .md h3 { font-size: 1.2em; }
  .md h4 { font-size: 1.1em; } .md h5 { font-size: 1em; } .md h6 { font-size: .9em; color: #aaa; }
  .md ul, .md ol { margin: 4px 0; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid #555; color: #bbb; }
  .md pre { margin: 6px 0; padding: 8px; background: #1b1b1b; border-radius: 4px;
            overflow-x: auto; white-space: pre; word-break: normal;
            font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .md code { background: #1b1b1b; padding: 1px 4px; border-radius: 3px;
             font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 6px 0; }
  .md th, .md td { border: 1px solid #555; padding: 3px 8px; }
  .md th { background: #333; }
  .md a { color: #6ec1e4; }
  .md hr { border: none; border-top: 1px solid #555; margin: 8px 0; }
  .msg .who { font-weight: bold; font-size: 11px; color: #6ec1e4; }
  .msg.assistant .who { color: #a8d08d; }
  .msg.mine { background: #094771; }
  .msg.failed { border: 1px solid #f48771; }
  .msg .status { font-size: 11px; color: #888; margin-left: 6px; }
  .resend { margin-left: 8px; font-size: 11px; padding: 1px 6px; }
  #inputrow { display: flex; flex-direction: column; gap: 4px; padding: 6px; background: #252526; }
  #msg { width: 100%; min-height: 110px; padding: 8px; background: #1e1e1e; color: #ddd;
         border: 1px solid #444; border-radius: 4px; resize: vertical; font-size: 14px; line-height: 1.4; }
  #inputbar { display: flex; align-items: center; gap: 8px; }
  #genIndicator { font-size: 12px; color: #d7ba7d; font-variant-numeric: tabular-nums; }
  #inputbar #sendBtn { margin-left: auto; }   /* 送信ボタンは常に右端（インジケータ有無に依らず） */
  #status { font-size: 11px; color: #888; padding: 2px 8px; }
  .notice { color: #d7ba7d; font-size: 12px; padding: 6px 8px; }
  .gap { color: #888; font-style: italic; font-size: 11px; text-align: center; margin: 6px 0; }
  #enter .remember { display: flex; align-items: center; gap: 6px; margin: 6px 0 14px; font-size: 13px; }
  #enter .remember input { width: auto; margin: 0; }
</style>
</head>
<body>

<div id="enter">
  <h1>MyAnalysis — meeting / ミーティング</h1>
  <label>Invite token / 招待トークン</label>
  <input id="tokenInput" placeholder="paste token…" autocomplete="off">
  <label>Display name / 表示名</label>
  <input id="nameInput" placeholder="Guest" autocomplete="off">
  <label class="remember"><input id="rememberChk" type="checkbox"> Remember me / この端末に保存</label>
  <div id="enterErr" class="err"></div>
  <button id="joinBtn">Join / 入室</button>
</div>

<div id="app">
  <div id="cols">
    <div id="left">
      <div class="bar" id="dsBar" style="display:none"><button id="followToggle" class="followtoggle"></button></div>
      <div class="bar" id="tabBar"></div>
      <div id="canvaswrap">
        <img id="view" alt="">
        <div id="viewEmpty" class="viewempty" style="display:none"></div>
      </div>
      <div class="bar">
        <button id="copyBtn">Copy image</button>
        <button id="dlBtn">Download</button>
        <span id="zoomInfo" style="font-size:11px;color:#888;margin-left:auto"></span>
      </div>
    </div>
    <div id="splitter" title="drag to resize / ドラッグで幅調整・ダブルクリックで既定値"></div>
    <div id="right">
      <div class="bar" id="sessionBar"></div>
      <div id="sessNotice" class="notice" style="display:none"></div>
      <div class="bar" id="histBar" style="display:none"><button id="histBtn" class="tabbtn"></button><span id="toolDisplayLbl" style="margin-left:auto;align-self:center;font-size:11px;color:#aaa"></span><select id="toolDisplaySel" class="tabbtn"></select></div>
      <div id="chatlog"></div>
      <div id="status"></div>
      <div id="inputrow">
        <textarea id="msg" rows="5" placeholder="Message… (Enter to send)"></textarea>
        <div id="inputbar">
          <span id="genIndicator" style="display:none"></span>
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
  <div id="ctxmenu" class="ctxmenu" style="display:none">
    <div class="ctxitem" id="ctxCopyName"></div>
    <div class="ctxitem" id="ctxComment"></div>
  </div>
</div>

<script>
"use strict";

// ---- minimal i18n (guest-side only) ----
const LANG = (navigator.language || "en").startsWith("ja") ? "ja" : "en";
const T = {
  en: { generating: "generating…", optedOut: "This session is no longer shared.",
        sendFail: "send failed", resend: "resend", expired: "Meeting ended (channel expired).",
        gap: "— some messages may have been skipped —", connecting: "connecting…",
        connected: "connected", badToken: "Invalid token.",
        sending: "Sending…", sent: "Sent ✓",
        hostOffline: "Host disconnected — reconnecting", retrying: "Connection issue — retrying…",
        loadOlder: "Load older history", loadingHistory: "Loading…", noMoreHistory: "No older messages",
        toolDisplay: "Tool calls", toolFull: "Full", toolCompact: "Compact", toolHidden: "Hidden",
        copyTabName: "Copy tab name", commentOnTab: "Comment on this tab",
        tabCommentPrefix: "[Comment on tab: {name}] ",
        noDataset: "(no dataset)", switchingDs: "Dataset switched — loading view…",
        followHost: "Follow host",
        followHostHint: "Auto-switch your dataset to match the host. Clicking a dataset chip turns this off.",
        noTabs: "(no shared tabs)", noSessionsInDataset: "No shared chats in this dataset.",
        newChat: "New chat",
        newChatNullDs: "Pick a dataset first — chats here are not saved",
        newChatPending: "Creating a new chat…",
        newChatTimeout: "The new chat did not appear.",
        viewHint: "Full figure — scroll to zoom, drag to pan, double-click to reset" },
  ja: { generating: "応答生成中…", optedOut: "このセッションは非公開になりました。",
        sendFail: "送信失敗", resend: "再送", expired: "ミーティングが終了しました（チャネル失効）。",
        gap: "— 一部のメッセージがスキップされました —", connecting: "接続中…",
        connected: "接続OK", badToken: "トークンが不正です。",
        sending: "送信中…", sent: "送信済 ✓",
        hostOffline: "ホスト切断 — 再接続待ち", retrying: "接続不良 — 再試行中…",
        loadOlder: "過去履歴を取得", loadingHistory: "取得中…", noMoreHistory: "これ以上の履歴はありません",
        toolDisplay: "ツール呼び出し表示", toolFull: "通常", toolCompact: "簡略", toolHidden: "非表示",
        copyTabName: "タブ名をコピー", commentOnTab: "このタブにコメント",
        tabCommentPrefix: "[タブ「{name}」へのコメント] ",
        noDataset: "（データセットなし）", switchingDs: "データセット切替中 — ビューを読込中…",
        followHost: "ホストに追従",
        followHostHint: "表示データセットをホストへ自動追従します。データセットのチップをクリックすると解除されます。",
        noTabs: "（共有中のタブなし）", noSessionsInDataset: "このデータセットに共有中のチャットはありません。",
        newChat: "新規チャット",
        newChatNullDs: "先にデータセットを選んでください（ここのチャットは保存されません）",
        newChatPending: "新規チャットを作成中…",
        newChatTimeout: "新規チャットが作成されませんでした。",
        viewHint: "全体図 — ホイールで拡大、ドラッグで移動、ダブルクリックで戻す" },
}[LANG];

// ---- constants (mirror worker.js) ----
const LOOKBACK_MS = 15000;
const POLL_MIN = 1000, POLL_MAX = 30000;
const FETCH_TIMEOUT_MS = 10000;
const PRESENCE_INTERVAL_MS = 20000;
const PENDING_NEW_MS = 30000;   // "+" 自動選択予約の寿命（Issue #81）
const STATUS_MSG_MS = 5000;     // status 行の一時メッセージ寿命（Issue #81）

// ---- tool-call display (本体 gui/chat.py の3段階表示をミラー。受信した生テキストは
// 常に保持し、描画時にモードで簡略化する＝表示のみ・可逆。各ゲストのローカル設定で、
// ワイヤ上の送信内容は変えない) ----
const TOOL_CALL_MARKER = "🔧", TOOL_RESULT_MARKER = "↳", TOOL_ERROR_MARKER = "✗";
const TOOL_RESULT_INDENT = "   ";          // 3 spaces, mirror llm_backend/base.py
const TOOL_DISPLAY_KEY = "ma_tool_display";
const TOOL_DISPLAY_MODES = ["full", "compact", "hidden"];
function loadToolDisplay() {
  try { const v = localStorage.getItem(TOOL_DISPLAY_KEY);
        return TOOL_DISPLAY_MODES.includes(v) ? v : "compact"; }   // 既定 compact
  catch (e) { return "compact"; }
}
function saveToolDisplay(m) { try { localStorage.setItem(TOOL_DISPLAY_KEY, m); } catch (e) {} }
let toolDisplay = loadToolDisplay();

function isToolCall(l)   { return l.startsWith(TOOL_CALL_MARKER + " "); }
function isToolResult(l) { return l.startsWith(TOOL_RESULT_INDENT + TOOL_RESULT_MARKER + " ")
                               || l.startsWith(TOOL_RESULT_INDENT + TOOL_ERROR_MARKER + " "); }
function isToolLine(l)   { return isToolCall(l) || isToolResult(l); }
function toolCallName(l) {
  const rest = l.slice((TOOL_CALL_MARKER + " ").length);   // "🔧 " を除去
  const i = rest.indexOf("  ");                            // summary 区切り(半角2スペース)
  return ((i === -1 ? rest : rest.slice(0, i)).trim()) || "tool";
}

// Display-only transform of an assistant message, mirroring本体 _simplify_tool_text.
// plain-text 版（guest は pre-wrap のテキスト描画なので markdown 用の空行挿入はしない）:
//   full    = 無変換
//   compact = 連続するツール run を、呼び出し名のみの 1 行 `🔧 A · B · C` に集約
//             （順序・重複保持、引数summary破棄、結果行(↳/✗)破棄）
//   hidden  = ツール行(呼び出し+結果)を run ごと全削除
// ツール行除去で空いた連続空行は1つに畳み、前後の余り空行は trim する。本文(prose)は維持。
// 本体との差は「呼び出しの無い結果のみの run」を残さない点のみ（display 目的では十分）。
function simplifyToolText(content, mode) {
  if (!content || mode === "full") return content;        // full: 無変換（現状維持）
  const lines = content.split("\n");
  if (!lines.some(isToolLine)) return content;
  const kept = [];
  if (mode === "hidden") {
    // hidden: ツール行を全削除（現行の行フィルタと byte 一致）。prose のみ残す。
    for (const l of lines) { if (!isToolLine(l)) kept.push(l); }
  } else {
    // compact: 連続するツール run（呼び出し・結果＋run 内部の空行を吸収。
    // 本体 _simplify_tool_text の吸収規則に準拠）を、呼び出し名のみの 1 行
    // `🔧 A · B · C` に集約。呼び出しの無い結果のみ run は何も出さない
    // （後述の documented 差異を維持）。prose 行はそのまま。
    const n = lines.length;
    let i = 0;
    while (i < n) {
      if (isToolLine(lines[i])) {
        const names = [];
        let j = i;
        while (j < n) {
          if (isToolLine(lines[j])) {
            if (isToolCall(lines[j])) names.push(toolCallName(lines[j]));
            j++;
          } else if (lines[j] === "") {
            let k = j;
            while (k < n && lines[k] === "") k++;
            if (k < n && isToolLine(lines[k])) j = k;      // run 内部の空行 → 吸収
            else break;                                    // 末尾/区切りの空行 → run 外
          } else {
            break;                                         // prose → run 終了
          }
        }
        if (names.length) kept.push(TOOL_CALL_MARKER + " " + names.join(" · "));
        i = j;
      } else {
        kept.push(lines[i]);
        i++;
      }
    }
  }
  const out = [];
  for (const l of kept) {
    if (l === "" && (out.length === 0 || out[out.length - 1] === "")) continue;  // 連続空行を畳む
    out.push(l);
  }
  while (out.length && out[out.length - 1] === "") out.pop();                     // 末尾空行 trim
  return out.join("\n");
}

// ---- markdown rendering (assistant 確定メッセージのみ; ホスト gui/chat.py の
// QTextDocument.setMarkdown(GFM) 相当の軽量サブセット。外部ライブラリ/外部スクリプト不使用・
// escape-first・never-throw)。生テキストをまず HTML エスケープし、その後で既知の安全
// タグのみ生成する。innerHTML 注入は変換後の安全HTMLに対してのみ行う。 ----
function escapeHtml(s) {
  if (s == null) return "";                       // null/undefined も安全に空文字
  return String(s)
    .replace(/&/g, "&amp;")                       // & を最初に（後だと二重実体化で壊れる）
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// リンク/画像 URL の allowlist（XSS 防御の要）。先頭の空白/制御文字を除去しスキームを
// 小文字化してから http:/https:/mailto: で始まる場合のみ返す（プロトコル相対 //host も
// 非許可）。それ以外は null（→ リンク化せずプレーン表示）。
function safeUrl(raw) {
  if (raw == null) return null;
  const trimmed = String(raw).replace(/^[\s\u0000-\u001f]+/, "");
  const low = trimmed.toLowerCase();
  if (low.startsWith("http:") || low.startsWith("https:") || low.startsWith("mailto:")) return trimmed;
  return null;
}

// GFM パイプ表の区切り行か（先頭/末尾パイプ任意・各セルは :?-+:?）。
function isTableSeparator(line) {
  const t = line.trim();
  if (t.indexOf("-") === -1) return false;
  const cells = t.replace(/^\|/, "").replace(/\|$/, "").split("|");
  return cells.length > 0 && cells.every((c) => /^\s*:?-+:?\s*$/.test(c));
}
function splitTableRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
}

// インライン整形（必ず escapeHtml 済みテキスト上で実行）。画像→リンク→太字→斜体→打消し
// の順。生成済み <a> は保護トークンに退避して後続の強調正規表現の対象から除外する
// （URL 内の _/* で href が壊れるのを防ぐ）。非許可 URL はリンク化せず literal 表示。
function inlineFormat(s) {
  const prot = [];
  const hold = (html) => { prot.push(html); return "\u0000" + (prot.length - 1) + "\u0000"; };
  s = s.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (m, alt, url) => {   // 画像はリンクより先に処理
    const u = safeUrl(url);                       // 自動フェッチしない: alt(+許可時リンク)のみ
    return u ? hold("<a href=\"" + u + "\">" + alt + "</a>") : alt;
  });
  s = s.replace(/\[([^\]]*)\]\(([^)]*)\)/g, (m, txt, url) => {    // 最初の ) を URL 終端とする
    const u = safeUrl(url);
    return u ? hold("<a href=\"" + u + "\">" + txt + "</a>") : m; // 非許可はエスケープ済み literal
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/_([^_]+)_/g, "<em>$1</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => prot[+i]);    // 保護した <a> を復元
}
function renderInline(text) {
  let out = "";
  for (const part of String(text).split(/(`[^`\n]*`)/)) {        // インラインコードを先に分離
    if (part.length >= 2 && part[0] === "`" && part[part.length - 1] === "`")
      out += "<code>" + part.slice(1, -1) + "</code>";           // 中身は escape 済み・無変換
    else out += inlineFormat(part);
  }
  return out;
}

// インデント基準の箇条書き/番号付きリスト（1段ネスト対応）。[html, 次行index] を返す。
function renderList(lines, start) {
  const itemRe = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;
  const first = itemRe.exec(lines[start]);
  const baseIndent = first[1].length;
  const tag = /\d+\./.test(first[2]) ? "ol" : "ul";
  let i = start, html = "<" + tag + ">";
  while (i < lines.length) {
    if (lines[i].trim() === "") break;
    const m = itemRe.exec(lines[i]);
    if (!m || m[1].length !== baseIndent) break;                 // dedent/indent はループ外/再帰へ
    const content = m[3];
    i++;
    let nested = "";
    const nm = i < lines.length ? itemRe.exec(lines[i]) : null;
    if (nm && nm[1].length > baseIndent) { const r = renderList(lines, i); nested = r[0]; i = r[1]; }
    html += "<li>" + renderInline(content) + nested + "</li>";
  }
  return [html + "</" + tag + ">", i];
}

// ブロック開始行か（段落の取り込みをここで止める境界）。
function isBlockStart(lines, i) {
  const line = lines[i], t = line.trim();
  if (isToolCall(line)) return true;              // ツール行は段落に取り込まず独立ブロックにする
  if (/^(#{1,6})\s+/.test(t)) return true;
  if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) return true;
  if (/^&gt;\s?/.test(t)) return true;                           // 引用 > はエスケープ後 &gt;
  if (/^(\s*)([-*+]\s+|\d+\.\s+)/.test(line)) return true;
  if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSeparator(lines[i + 1])) return true;
  return false;
}

// 非コード片（escape 済み）をブロック単位で安全HTMLへ。開きタグと閉じタグは対で生成し、
// 未閉じタグを出さない（structurally balanced）。
function renderBlocks(src) {
  const lines = src.split("\n"), html = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i], t = line.trim();
    if (t === "") { i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { html.push("<hr>"); i++; continue; }   // 水平線
    const hm = /^(#{1,6})\s+(.*)$/.exec(t);                       // 見出し
    if (hm) { const n = hm[1].length; html.push("<h" + n + ">" + renderInline(hm[2]) + "</h" + n + ">"); i++; continue; }
    if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {   // GFM 表(2行ルックアヘッド)
      const head = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") { rows.push(splitTableRow(lines[i])); i++; }
      let tbl = "<table><thead><tr>";
      for (const c of head) tbl += "<th>" + renderInline(c) + "</th>";
      tbl += "</tr></thead><tbody>";
      for (const r of rows) { tbl += "<tr>"; for (const c of r) tbl += "<td>" + renderInline(c) + "</td>"; tbl += "</tr>"; }
      html.push(tbl + "</tbody></table>");
      continue;
    }
    if (/^&gt;\s?/.test(t)) {                                     // 引用（再帰でブロック処理）
      const q = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i].trim())) { q.push(lines[i].trim().replace(/^&gt;\s?/, "")); i++; }
      html.push("<blockquote>" + renderBlocks(q.join("\n")) + "</blockquote>");
      continue;
    }
    if (/^(\s*)([-*+]\s+|\d+\.\s+)/.test(line)) { const r = renderList(lines, i); html.push(r[0]); i = r[1]; continue; }
    if (isToolCall(line)) {                        // ツール集約行/呼び出し行は literal 表示
      html.push("<p>" + line + "</p>");            // line は escapeHtml 済み。inlineFormat を通さず
      i++;                                         // 語中 _ の誤 <em>/<strong> を防ぐ
      continue;
    }
    const para = [];                                             // 段落: 空行/ブロック境界まで収集
    while (i < lines.length && lines[i].trim() !== "" && !isBlockStart(lines, i)) { para.push(lines[i]); i++; }
    html.push("<p>" + renderInline(para.join("\n")).replace(/\n/g, "<br>") + "</p>");   // 段落内の単一改行のみ <br>
  }
  return html.join("\n");
}

// ホスト GFM 相当の軽量サブセット。崩れた入力でも例外を投げない（never-throw）。フェンス
// ドコードは境界(``` 行)で非コード片/コード片の交互列に分割し、コード片は escape のみで
// <pre><code> 化＝プレースホルダ衝突を構造的に排除する。
function renderMarkdown(text) {
  const raw = (text == null) ? "" : String(text).replace(/\u0000/g, "");   // sentinel 衝突を構造的に排除
  try {
    const lines = escapeHtml(raw).split("\n");                  // escape-first（& → < > " '）
    const out = [];
    let buf = [], code = [], inCode = false;
    const flush = () => { if (buf.length) { out.push(renderBlocks(buf.join("\n"))); buf = []; } };
    for (const line of lines) {
      if (/^\s*```/.test(line)) {                               // フェンス境界
        if (!inCode) { flush(); inCode = true; code = []; }
        else { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); inCode = false; code = []; }
        continue;
      }
      if (inCode) code.push(line); else buf.push(line);
    }
    if (inCode) out.push("<pre><code>" + code.join("\n") + "</code></pre>");   // 未閉じフェンスも graceful
    else flush();
    return out.join("\n");
  } catch (e) {
    return escapeHtml(raw).replace(/\n/g, "<br>");              // フォールバック: .md(normal) 前提で改行→<br>
  }
}

// Markdown 化可否の単一述語（renderMsgEl / updateMsgText の両描画サイトから呼ぶ）。
// partial !== true は確定(false)・非ストリーム(フィールド不在=undefined)の両方をカバー。
function wantsMarkdown(m) { return m.role === "assistant" && m.partial !== true; }

// ---- state ----
let cfg = null;                 // {base_url, channel, secret}
let pid = null;                 // participant id (high-entropy)
let myName = "Guest";
let curSid = null;              // selected chat session id
let curTab = null;             // selected analysis tab name
let curDs;                      // active dataset mirrored from the host's poll.
                                // undefined = server never said (pre-DS host) → DS bar
                                // hidden, no switch logic. null = dataset-less group.
let viewGen = 0;                // bumped on a dataset switch; in-flight /view results
                                // of an older generation are discarded, never painted
let optOutStrikes = 0;          // consecutive polls with curSid unpublished (the
                                // opt-out notice is debounced to 2 so a dataset
                                // switch doesn't flash it for one cycle)
const selTabByDs = {};          // dsKey ("" for null) → last selected tab (switch-back)
const selSidByDs = {};          // dsKey → last selected session (switch-back)
const draftByDs = {};           // dsKey → 未送信ドラフト（#msg の内容）。DS 切替で退避/復元する
                                // （Issue #80。selTabByDs/selSidByDs と同じ per-DS 退避パターン）。
                                // ページ寿命・プルーニングしない: DS がチップ一覧から一時的に
                                // 消えるのは日常的で、同期して消すと打鍵内容を無言で破棄する。
let followTarget = "none";      // "none" = 独立(既定) | "host" = ホストの active_dataset に
                                // 追従。将来は参加者 pid も取りうるので文字列で持つ（衝突回避の
                                // ため pid は "pid:" 接頭辞を予約）。DSチップの手動クリックで
                                // "none" に戻る（Issue #80）。
let hostActiveDs;               // 直近ポールで受け取ったホストの active_dataset（生値:
                                // null = null グループ）。undefined = 一度も受信していない。
                                // JSON.parse は値 undefined を生まないので、受信後にこの変数が
                                // undefined になることはない（followHostIfNeeded のコメント参照）。
let dsChips = [];               // 直近ポールの datasets（= DSバーのチップ集合。wire key で
                                // "" = null グループ）。追従先の妥当性判定に使う。
let pollInterval = 3000;
let pollTimer = null;
let pollGen = 0;                // generation token: only the latest poll() renders/reschedules
let stopped = false;
let lastViewVersions = {};      // last-received vv map (per tab)
const appliedVv = {};           // tab → version successfully decoded+painted
const viewInflight = new Set(); // "gen:tab" keys with an in-flight /view fetch (de-dupe)
let lastPresenceMs = 0;
let histInflight = false;       // one /history fetch in flight at a time
// Issue #81: guest-minted chat. The host mints the id, so the guest reserves an
// auto-select by snapshotting THIS dataset's known session ids at press time and
// selecting whichever id shows up that wasn't in the snapshot.
let pendingNewSelect = null;     // {ds, before:Set<string>, select:boolean, deadline:number} | null
let newSessionInflight = false;  // POST 多重発行の抑止（押下抑止は pendingNewSelect が担う）
let lastFilteredSids = new Set();// 直近 renderSessions の現DSセッションid集合
let lastFilteredDs = undefined;  // そのスナップショットを取った時の curDs（?? "" 前の生値）
// status 行の一時占有。poll は毎回 T.connected を書くので、期限内はこちらを優先する。
let statusOverride = null;       // {text:string, until:number} | null

// ---- per-session chat store (in-memory; survives session-tab switches, cleared
// on page reload). The msgs array is the render source of truth, so switching
// sessions re-renders from memory instead of wiping the DOM + re-polling (which
// lost everything past the 15s lookback). Each entry:
// {mid,text,name,role,mine?,status?,stream_id?,partial?,_el?,_txtEl?}.
// `streams` maps an in-flight assistant turn's stream_id → its message object so
// streaming partials update the SAME bubble in place (see upsertStreamMsg).
const store = new Map();        // sid -> SessionState
let cur = null;                 // active session's state (= store.get(curSid))
function getState(sid) {
  let s = store.get(sid);
  if (!s) {
    s = { msgs: [], have: new Set(), latestSeenTs: 0, lastDisplayedTs: 0,
          gapShown: false, oldestMid: null, histExhausted: false,
          streams: new Map() };
    store.set(sid, s);
  }
  return s;
}

// ---- token decode (base64url → JSON) ----
function decodeToken(tok) {
  let s = tok.trim().replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const obj = JSON.parse(atob(s));
  if (!obj.base_url || !obj.channel || !obj.secret) throw new Error("missing fields");
  // strip a trailing slash on base_url for clean concatenation
  obj.base_url = String(obj.base_url).replace(/\/+$/, "");
  return obj;
}

function genPid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  if (crypto && crypto.getRandomValues) {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  return "p" + Math.random().toString(36).slice(2); // last resort (very old env)
}

// ---- fetch with AbortController timeout (body read is ALSO inside the guard) ----
// Reads the body inside the try so a header-then-stall (mobile/proxy/edge) aborts
// at FETCH_TIMEOUT_MS instead of hanging forever on a later await res.json()/blob().
async function api(path, { method = "GET", body = null, expect = "json" } = {}) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const headers = { "Authorization": "Bearer " + cfg.secret };
    if (body !== null) headers["content-type"] = "application/json";
    const res = await fetch(cfg.base_url + path, {
      method, headers,
      body: body === null ? null : JSON.stringify(body),
      signal: ctrl.signal,
    });
    let data = null;
    if (res.status !== 204 && res.ok) {                 // 204 / non-2xx → data=null
      if (expect === "json") data = await res.json();   // parse/abort failures throw (json/blob symmetric)
      else if (expect === "blob") data = await res.blob();
    }
    return { status: res.status, ok: res.ok, data };    // body read also under abort protection
  } finally {
    clearTimeout(to);
  }
}

function pad13(n) { return String(n).padStart(13, "0"); }
function sinceParam() {
  const floor = Math.max(0, (cur ? cur.latestSeenTs : 0) - LOOKBACK_MS);
  return pad13(floor) + "-" + "0".repeat(13);
}

// ---- self-destruct on expiry/auth failure ----
function selfDestruct() {
  if (stopped) return;
  stopped = true;
  if (pollTimer) clearTimeout(pollTimer);
  setGenerating(false);
  document.getElementById("status").textContent = T.expired;
  document.getElementById("sendBtn").disabled = true;
}

// ---- generating indicator (応答生成中: 入力欄の周辺で braille スピナーを回す。
// ホスト側 gui/chat.py の待機表示(_SPINNER / chat.status.waiting)をミラー) ----
const SPINNER = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
let spinIdx = 0, spinTimer = null;
function setGenerating(on) {
  const el = document.getElementById("genIndicator");
  if (!el) return;
  if (on) {
    el.style.display = "";
    if (spinTimer === null) {
      const paint = () => {
        spinIdx = (spinIdx + 1) % SPINNER.length;
        el.textContent = SPINNER[spinIdx] + " " + T.generating;
      };
      paint();                                // 即時に1フレーム（待たせない）
      spinTimer = setInterval(paint, 80);     // ホストと同じ 80ms
    }
  } else {
    el.style.display = "none";
    el.textContent = "";
    if (spinTimer !== null) { clearInterval(spinTimer); spinTimer = null; }
  }
}

// ---- chat rendering ----
// Build (and (re)assign m._el to) a DOM node from a stored message. Own messages
// carry a status span that reflects m.status across (re)renders.
function renderMsgEl(m) {
  const div = document.createElement("div");
  div.className = "msg " + (m.role === "assistant" ? "assistant" : "") + (m.mine ? " mine" : "")
                 + (m.status === "failed" ? " failed" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.name || (m.role === "assistant" ? "AI" : "Guest");
  const txt = document.createElement("div");
  // m.text は生のフルテキストのまま保持し、表示時だけモードで簡略化（assistant のみ）。
  const shown = (m.role === "assistant") ? simplifyToolText(m.text, toolDisplay) : m.text;
  // 契約: assistant 確定メッセージのみ本文を innerHTML(安全HTML) で描画。それ以外は従来 textContent(プレーン)。
  if (wantsMarkdown(m)) {
    if (!(m._md && m._md.mode === toolDisplay)) m._md = { mode: toolDisplay, html: renderMarkdown(shown) };
    txt.innerHTML = m._md.html;            // renderMarkdown 結果(escape-first 安全HTML)
    txt.classList.add("md");
  } else {
    txt.textContent = shown;
  }
  div.appendChild(who);
  div.appendChild(txt);
  if (m.mine === true) {
    const st = document.createElement("span");
    st.className = "status";
    st.textContent = m.status === "sent" ? T.sent : (m.status === "failed" ? T.sendFail : T.sending);
    div.appendChild(st);
  }
  // hidden 等で本文が空になった assistant バブルは出さない（本体 _render_session と同様）。
  // store からは消さないので、full に戻して再描画すれば復活する。
  if (m.role === "assistant" && !shown.trim()) div.style.display = "none";
  m._el = div;
  m._txtEl = txt;   // 本文ノード参照（ストリーミングの in-place 更新に使う）
  return div;
}

// In-place update of an already-rendered message's body (streaming partials).
// Mirrors renderMsgEl's text path: re-simplify for assistants, hide if empty.
function updateMsgText(m) {
  if (!m._el || !m._txtEl) return;
  const shown = (m.role === "assistant") ? simplifyToolText(m.text, toolDisplay) : m.text;
  // 契約: renderMsgEl と同一。assistant 確定のみ innerHTML(安全HTML)、他は textContent(プレーン)。
  if (wantsMarkdown(m)) {
    if (!(m._md && m._md.mode === toolDisplay)) m._md = { mode: toolDisplay, html: renderMarkdown(shown) };
    m._txtEl.innerHTML = m._md.html;
    m._txtEl.classList.add("md");
  } else {
    m._txtEl.textContent = shown;
    m._txtEl.classList.remove("md");
  }
  m._el.style.display = (m.role === "assistant" && !shown.trim()) ? "none" : "";
}

// Create-or-update a streaming assistant message, correlated by stream_id. The
// relay re-mints the mid on every partial (to stay in the lookback window), so
// dedup-by-mid still admits each update; we then update the SAME bubble in place
// instead of appending a new one. partial===false marks the turn final.
function upsertStreamMsg(state, m) {
  const existing = state.streams.get(m.stream_id);
  if (existing) {
    if (m.mid) state.have.add(m.mid);
    existing.text = m.text;
    if (m.mid) existing.mid = m.mid;
    existing.partial = m.partial;
    updateMsgText(existing);
    if (state === cur) {
      const log = document.getElementById("chatlog");
      // ユーザーが下端付近にいる時だけ追従スクロール（上に遡って読んでいる最中は動かさない）。
      if (log.scrollHeight - log.scrollTop - log.clientHeight < 80) log.scrollTop = log.scrollHeight;
    }
  } else {
    appendMsg(state, m);          // first partial: render a fresh bubble (adds mid to have)
    state.streams.set(m.stream_id, m);
  }
  if (m.partial === false) state.streams.delete(m.stream_id);  // 確定 → 以降は不変
}

// Add a live/own message to a session's store (and the DOM bottom if active).
function appendMsg(state, m) {
  if (m.mid && state.have.has(m.mid)) return null;   // dedup (poll echo / re-entry)
  if (m.mid) state.have.add(m.mid);
  state.msgs.push(m);
  if (state.oldestMid === null && m.mid) state.oldestMid = m.mid;
  if (state === cur) {
    const log = document.getElementById("chatlog");
    log.appendChild(renderMsgEl(m));
    log.scrollTop = log.scrollHeight;
  }
  return m;
}

// Prepend older history (ascending mid order) to a session, preserving scroll.
function prependMsgs(state, arr) {
  const fresh = (arr || []).filter((m) => m.mid && !state.have.has(m.mid));
  if (!fresh.length) return;
  for (const m of fresh) state.have.add(m.mid);
  state.msgs = fresh.concat(state.msgs);
  state.oldestMid = state.msgs[0].mid;
  if (state === cur) {
    const log = document.getElementById("chatlog");
    const prevH = log.scrollHeight, prevTop = log.scrollTop;
    const frag = document.createDocumentFragment();
    for (const m of fresh) frag.appendChild(renderMsgEl(m));
    log.insertBefore(frag, log.firstChild);
    log.scrollTop = prevTop + (log.scrollHeight - prevH);   // keep the viewport anchored
  }
}

// Rebuild #chatlog from a session's stored msgs (on session switch). #histBar is
// a sibling of #chatlog, so it is not affected.
function rerenderAll(state) {
  const log = document.getElementById("chatlog");
  log.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const m of state.msgs) frag.appendChild(renderMsgEl(m));
  log.appendChild(frag);
  log.scrollTop = log.scrollHeight;
}

function setMsgStatus(m, statusKey, text) {
  m.status = statusKey;
  if (!m._el) return;
  const span = m._el.querySelector(".status");
  if (span) span.textContent = text;
  m._el.classList.toggle("failed", statusKey === "failed");
}

function showGapIfNeeded(serverNowMs) {
  // Only when an actual gap opened (reanchor jumped past lookback) AND we have
  // painted something before. De-dupe until the next real message arrives.
  if (!cur || cur.gapShown || cur.lastDisplayedTs === 0) return;
  if (serverNowMs - cur.lastDisplayedTs > LOOKBACK_MS) {
    const log = document.getElementById("chatlog");
    const g = document.createElement("div");
    g.className = "gap";
    g.textContent = T.gap;
    log.appendChild(g);
    cur.gapShown = true;
  }
}

// ---- unified poll ----
async function poll(reanchor = false) {
  if (stopped) return;
  // Cancel any pending scheduled poll so a direct poll(true) (selectSession /
  // visibilitychange / join) doesn't leave a stale timer alongside this run.
  if (pollTimer) clearTimeout(pollTimer);
  // Generation token: only the newest poll() updates UI / reschedules. A direct
  // poll(true) that overtakes an in-flight poll bumps pollGen; the older run
  // returns after its await without rendering or rescheduling (reviewer P2-3).
  const myGen = ++pollGen;
  // Bootstrap: before a session is selected (curSid === null), poll with a sentinel
  // sid ("_") so the Worker still returns sessions/tabs/alive (messages empty for an
  // unknown sid). renderSessions() then selects the first session and re-polls.
  // Without this, the old `!curSid` early-return deadlocked first entry. reviewer code R1 P1.
  const bootstrap = !curSid;
  const sidPath = curSid || "_";
  try {
    const since = (reanchor || bootstrap)
      ? "?since=RESET"
      : "?since=" + encodeURIComponent(sinceParam());
    // `since` already opened the query with `?`, so ds is joined with `&`. Omit
    // ds entirely while bootstrapping (curDs === undefined) — an empty `ds=` would
    // route to the null group. New guests always send ds (empty for the null group).
    const dsQ = (curDs !== undefined) ? "&ds=" + encodeURIComponent(curDs ?? "") : "";
    const r = await api("/poll/" + encodeURIComponent(cfg.channel) + "/" +
                        encodeURIComponent(sidPath) + since + dsQ);
    // Permanent expiry is idempotent → handle before the generation check so even
    // an overtaken poll reliably detects channel death and stops.
    if (r.status === 401 || r.status === 410) { selfDestruct(); return; }
    if (myGen !== pollGen) return;                         // overtaken → newer poll owns render/reschedule
    if (r.status === 503) { document.getElementById("status").textContent = T.hostOffline; return; }
    if (!r.ok) { document.getElementById("status").textContent = T.retrying; return; }
    const data = r.data;                                   // already parsed by api() (throws on parse/abort)
    const serverNow = data.server_now_ms || 0;
    if (reanchor && cur) {
      showGapIfNeeded(serverNow);
      cur.latestSeenTs = serverNow;
    }
    // ---- DS layer (Issue #78 / #80): per-guest DS navigation ----
    // curDs is the guest-local source of truth. The host's active_dataset seeds
    // the first poll's default, and afterwards is applied only while the opt-in
    // "Follow host" toggle is on (followTarget === "host", Issue #80).
    if ("active_dataset" in data) {
      dsChips = data.datasets || [];
      // JSON.parse never yields the value `undefined`, so once this branch is taken
      // active_dataset is null or a string. hostActiveDs === undefined therefore
      // keeps meaning exactly "no poll has delivered it yet" (== null is safe here).
      hostActiveDs = (data.active_dataset == null) ? null : String(data.active_dataset);
      if (curDs === undefined) {
        // First poll: default to the host's active DS (join is not a "switch").
        curDs = hostActiveDs;
      } else if (followHostIfNeeded()) {
        return;   // switchToDataset issued a fresh poll(true); this one is stale
      }
      renderDatasetBar(dsChips);
      // Snap if the current DS closed / was renamed away (no longer in the list).
      if (curDs !== undefined && dsChips.length && !dsChips.includes(curDs ?? "")) {
        switchToDataset(dsChips[0]);
        return;   // switchToDataset issued a fresh poll(true); this one is stale
      }
    }
    renderSessions(data.sessions || []);
    // renderSessions may call selectSession() (re-select / auto-select), which
    // issues its own poll(false) and bumps pollGen. If so, abandon the rest of
    // this poll: the response's messages belong to the OLD sid and must not be
    // applied to the swapped `cur` (reviewer R2 P1). finally won't reschedule
    // (myGen !== pollGen), and the newer poll owns render/reschedule.
    if (myGen !== pollGen) return;
    renderTabs(data.tabs || []);
    applyViewVersions(data.view_versions || {});
    // session opt-out detection — debounced to 2 consecutive polls so a dataset
    // switch never flashes the notice / disables send for one cycle. A genuine
    // opt-out shows one poll (~3s) later than before, which was already racy.
    // Scope `sids` to the CURRENT dataset so a lingering old-DS sid can't keep
    // send enabled after a switch (reviewer P1).
    const sids = (data.sessions || [])
      .filter((s) => (s.dataset ?? "") === (curDs ?? ""))
      .map((s) => s.id);
    const notice = document.getElementById("sessNotice");
    optOutStrikes = (curSid && !sids.includes(curSid)) ? optOutStrikes + 1 : 0;
    if (!curSid) {
      // 0-session dataset (no send target): disable send, show a neutral notice.
      notice.style.display = "block";
      notice.textContent = T.noSessionsInDataset;
      document.getElementById("sendBtn").disabled = true;
    } else if (optOutStrikes >= 2) {
      notice.style.display = "block";
      notice.textContent = T.optedOut;
      document.getElementById("sendBtn").disabled = true;
    } else {
      notice.style.display = "none";
      document.getElementById("sendBtn").disabled = false;
    }
    // 現在セッションが応答生成中なら入力欄周辺にスピナーを出す（s.busy はホスト由来）。
    const meBusy = !!curSid && (data.sessions || []).some((s) => s.id === curSid && s.busy);
    setGenerating(meBusy);
    // Render only into the active session's store (bootstrap "_" returns no
    // messages; cur is set by renderSessions -> selectSession on first entry).
    if (cur) {
      for (const m of (data.messages || [])) {
        if (!m.mid || cur.have.has(m.mid)) continue;
        if (m.stream_id) upsertStreamMsg(cur, m);   // in-flight assistant: その場更新
        else appendMsg(cur, m);
        const ts = parseInt(m.mid.slice(0, 13), 10) || 0;
        if (ts > cur.latestSeenTs) cur.latestSeenTs = ts;
        if (ts > cur.lastDisplayedTs) cur.lastDisplayedTs = ts;
        cur.gapShown = false; // a real message resets the gap de-dupe
      }
      if (serverNow > cur.latestSeenTs) cur.latestSeenTs = serverNow;
    }
    // Issue #81: 「+」由来の一時メッセージは期限内だけ status 行を占有する
    // （この行が毎ポーリング T.connected で潰してしまうため）。この行は成功パス
    // にしかないので、503 / !ok の間はホストオフライン・再試行表示が優先され、
    // newChatPending / newChatTimeout は表示されない（接続障害の告知が優先で妥当）。
    if (statusOverride && Date.now() >= statusOverride.until) statusOverride = null;
    document.getElementById("status").textContent =
      statusOverride ? statusOverride.text : T.connected;
    maybePresence();
  } catch (e) {
    if (myGen === pollGen) document.getElementById("status").textContent = T.retrying;
  } finally {
    if (!stopped && myGen === pollGen) schedulePoll();     // only the latest poll keeps the loop alive
  }
}

function schedulePoll() {
  if (stopped) return;
  // Cancel any pending timer before arming a new one so exactly ONE poll loop
  // ever exists. Without this, the bootstrap poll's schedulePoll() and the
  // selectSession()->poll(true) schedulePoll() both leave a timer, and every
  // session switch accumulates another (N+1 loops), breaking the "single
  // unified poll" cost invariant. reviewer/reviewer code R2.
  if (pollTimer) clearTimeout(pollTimer);
  pollInterval = Math.min(POLL_MAX, Math.max(POLL_MIN, pollInterval));
  pollTimer = setTimeout(() => poll(false), pollInterval);
}

// ---- presence (every ~20s, or immediately on sid/tab switch) ----
// Issue #78: the reported `tab` is a bare name qualified by the `ds` sent
// alongside it — the host's watched-DS view rendering keys on this ds, so a guest
// viewing a background DS gets that DS's views rendered on demand. ds is omitted
// while bootstrapping (curDs === undefined) so the host doesn't register the null
// group before the guest has chosen a DS (symmetric to poll's ds omission).
async function maybePresence(force = false) {
  const now = Date.now();
  if (!force && now - lastPresenceMs < PRESENCE_INTERVAL_MS) return;
  lastPresenceMs = now;
  try {
    await api("/presence/" + encodeURIComponent(cfg.channel), {
      method: "POST", expect: "none",
      body: {
        pid, name: myName || "Guest", sid: curSid || "", tab: curTab || "",
        ...(curDs !== undefined ? { ds: curDs ?? "" } : {}),
      },
    });
  } catch (e) { /* transient */ }
}

// ---- sessions / tabs UI ----
function renderSessions(sessions) {
  const bar = document.getElementById("sessionBar");
  // Issue #78: the flat all-DS session list is filtered to the current dataset.
  const filtered = sessions.filter((s) => (s.dataset ?? "") === (curDs ?? ""));
  const have = new Set(filtered.map((s) => s.id));
  lastFilteredSids = have;       // Issue #81: newSession() が差分の基準に使う
  lastFilteredDs = curDs;        // そのスナップショットがどの DS のものかを併記
  // Invalidate a curSid that no longer belongs to this dataset (switched DS, or
  // opted out) so it isn't a stale send target and auto-select can pick a fresh one.
  if (curSid && !have.has(curSid)) { curSid = null; cur = null; }
  // Issue #81: 「+」の予約は、before に無い id がこの dataset に現れた時点で解決する。
  // ボタン生成より前に解決するので、選ばれたタブはこの描画で .active が付く。
  if (pendingNewSelect) {
    if (pendingNewSelect.ds !== (curDs ?? "")) {
      // DS 切替 → 予約は無効。「作成中…」も畳む（実態と矛盾する表示を残さない）。
      pendingNewSelect = null;
      statusOverride = null;
    } else if (Date.now() > pendingNewSelect.deadline) {
      pendingNewSelect = null;                        // 期限切れ → ゲストに知らせる
      statusOverride = { text: T.newChatTimeout, until: Date.now() + STATUS_MSG_MS };
    } else {
      const fresh = filtered.find((s) => !pendingNewSelect.before.has(s.id));
      if (fresh) {
        const doSelect = pendingNewSelect.select;
        pendingNewSelect = null;
        if (doSelect) {
          statusOverride = null;      // 本物の新セッションを掴んだので「作成中…」を畳む
          selectSession(fresh.id);
        }
        // select:false（スナップショットが旧DS）のときの fresh は既存セッション
        // でありうるので「作成中…」は畳まず、statusOverride 自身の期限に委ねる。
      }
    }
  }
  bar.innerHTML = "";
  for (const s of filtered) {
    const b = document.createElement("button");
    b.className = "tabbtn" + (s.id === curSid ? " active" : "");
    b.textContent = (s.busy ? "● " : "") + (s.title || "chat") + (s.busy ? " (" + T.generating + ")" : "");
    b.onclick = () => selectSession(s.id);
    bar.appendChild(b);
  }
  // Issue #81: 「+」は毎ポーリングの innerHTML="" で消えるので毎回 append する。
  // 0セッションDSでも「最初の1件」を作れるよう、下の `if (!curSid)` 分岐に依存
  // しない位置（for ループ直後）に置く。null グループ（curDs が null/undefined）は
  // 作成対象外なので無効化し、理由をツールチップで示す。
  const nullDs = (curDs === null || curDs === undefined);
  const addBtn = document.createElement("button");
  addBtn.className = "tabbtn";
  addBtn.textContent = "+";
  addBtn.title = nullDs ? T.newChatNullDs : T.newChat;
  // 予約が生きている間は押せない（押下から出現までの数秒に二重作成させない）。
  addBtn.disabled = stopped || nullDs || newSessionInflight || !!pendingNewSelect;
  // 押下と同時に自分を disabled にする: 次の再描画は最短でも約1秒後なので、
  // renderSessions の式だけでは押下直後の見た目が変わらない。
  addBtn.onclick = () => { addBtn.disabled = true; newSession(); };
  bar.appendChild(addBtn);
  // 生成中はポーリングを速め（≈1s）、逐次表示をライブに感じさせる。非生成時は既定3s。
  // schedulePoll が直後（poll の finally）に clamp して再武装する。
  const activeBusy = filtered.some((s) => s.id === curSid && s.busy);
  pollInterval = activeBusy ? POLL_MIN : 3000;
  if (!curSid && filtered.length) {
    // Prefer this dataset's remembered selection; else the first session.
    const remembered = selSidByDs[curDs ?? ""];
    selectSession(filtered.some((s) => s.id === remembered) ? remembered : filtered[0].id);
  }
  if (!curSid) {
    // 0-session dataset: clear the old DS's conversation from the log so it isn't
    // mistaken for the current DS's history, and hide the history button.
    document.getElementById("chatlog").innerHTML = "";
    cur = null;
    updateHistBtn();
  }
}

// Issue #81: 「+」押下。ホストにセッション採番を依頼し、自動選択の予約を張る。
// `send()` と同じ ds クエリ規約・同じ 401/410 → selfDestruct 規約に従う。
async function newSession() {
  if (stopped || newSessionInflight || pendingNewSelect) return;
  if (curDs === null || curDs === undefined) return;   // null グループは作成対象外
  newSessionInflight = true;
  // before スナップショットが「今の DS のもの」でない場合（switchToDataset が
  // curDs を書き換えてから poll 応答が返るまでの窓）は、作成だけ行い自動選択は
  // しない。旧 DS の id 集合で差分を取ると新 DS の既存セッションを誤選択する。
  pendingNewSelect = {
    ds: (curDs ?? ""),
    before: new Set(lastFilteredSids),
    select: (lastFilteredDs === curDs),
    deadline: Date.now() + PENDING_NEW_MS,
  };
  try {
    const r = await api("/newsession/" + encodeURIComponent(cfg.channel) +
                        "?ds=" + encodeURIComponent(curDs),
                        { method: "POST", body: { name: myName || "Guest" } });
    if (r.status === 401 || r.status === 410) { pendingNewSelect = null; selfDestruct(); return; }
    if (!r.ok) {
      pendingNewSelect = null;   // 失敗 → 予約を残さない（他ゲスト作成分を誤選択しない）
      statusOverride = { text: T.sendFail, until: Date.now() + STATUS_MSG_MS };
      return;
    }
    statusOverride = { text: T.newChatPending, until: Date.now() + PENDING_NEW_MS };
    // 即座に1回 poll して出現を早く拾う。ポーリング間隔そのものは renderSessions が
    // 通常値（非生成時 3s）へ戻すので、以降は通常ポーリングのまま。検出遅延の上限は
    // ホストの capture 1s + poll 3s ≈ 4s。
    if (pollTimer) clearTimeout(pollTimer);
    poll(false);
  } catch (e) {
    pendingNewSelect = null;
    statusOverride = { text: T.sendFail, until: Date.now() + STATUS_MSG_MS };
  } finally {
    newSessionInflight = false;
  }
}

function selectSession(sid) {
  if (sid === curSid) return;
  curSid = sid;
  cur = getState(sid);
  optOutStrikes = 0;             // fresh selection → notice debounce restarts
  rerenderAll(cur);              // restore this session's retained history (no wipe)
  updateHistBtn();
  maybePresence(true);
  // Resume from this session's stored cursor (0 for a fresh session → loads its
  // full live history; otherwise fills anything missed while it was inactive).
  poll(false);
}

// ---- history (load older, 5 turns per press) ----
function updateHistBtn() {
  const btn = document.getElementById("histBtn");
  const bar = document.getElementById("histBar");
  if (!btn || !bar) return;
  if (!curSid) { bar.style.display = "none"; return; }
  bar.style.display = "";
  if (cur && cur.histExhausted) {
    btn.disabled = true;
    btn.textContent = T.noMoreHistory;
  } else {
    btn.disabled = histInflight;
    btn.textContent = histInflight ? T.loadingHistory : T.loadOlder;
  }
}

async function loadHistory() {
  if (!curSid || stopped || histInflight) return;
  const state = cur;                       // capture: user may switch sessions mid-fetch
  if (state.histExhausted) return;
  histInflight = true;
  updateHistBtn();
  try {
    const before = state.oldestMid ? "&before=" + encodeURIComponent(state.oldestMid) : "";
    const dsQ = (curDs !== undefined) ? "&ds=" + encodeURIComponent(curDs ?? "") : "";
    const r = await api("/history/" + encodeURIComponent(cfg.channel) + "/" +
                        encodeURIComponent(curSid) + "?turns=5" + before + dsQ);
    if (r.status === 401 || r.status === 410) { selfDestruct(); return; }
    if (r.ok && r.data) {
      prependMsgs(state, r.data.messages || []);
      if (!r.data.has_more) state.histExhausted = true;
    }
  } catch (e) { /* transient — leave the button enabled to retry */ }
  finally {
    histInflight = false;
    updateHistBtn();
  }
}

// ---- DS layer bar (mirrors the host's DatasetSwitcher above the tab layer).
// Issue #78: every shared DS is a clickable chip; curDs is the guest-local source
// of truth. Issue #80: #followToggle is a permanent child of #dsBar and chips are
// inserted before it, so re-rendering the chips must never wipe the toggle. ----
function renderDatasetBar(datasets) {
  const bar = document.getElementById("dsBar");
  bar.style.display = "";
  bar.querySelectorAll("button.tabbtn").forEach((b) => b.remove()); // チップのみ除去（トグルは残す）
  const toggle = document.getElementById("followToggle");
  for (const ds of datasets) {
    const b = document.createElement("button");
    b.className = "tabbtn" + (ds === (curDs ?? "") ? " active" : "");
    b.textContent = "◆ " + (ds === "" ? T.noDataset : ds);
    b.onclick = () => chipClick(ds);
    bar.insertBefore(b, toggle);                                    // チップはトグルの手前
  }
  renderFollowToggle();
}

// #followToggle は #dsBar の永続子（HTML に静的に置かれ、renderDatasetBar でも消さない）。
// ラベル・色・ハンドラだけをここで貼り替える。表示は followTarget だけで決まる（設計判断4:
// 「ON なのに追従していない」状態は不変条件 I1 の下では生じないので中間表示を持たない）。
function renderFollowToggle() {
  const ft = document.getElementById("followToggle");
  const on = followTarget === "host";
  ft.className = "followtoggle" + (on ? " on" : "");
  ft.textContent = (on ? "🔗 " : "🔓 ") + T.followHost + ": " + (on ? "ON" : "OFF");
  ft.title = T.followHostHint;
  ft.onclick = toggleFollow;
}

function toggleFollow() {
  followTarget = (followTarget === "host") ? "none" : "host";
  renderFollowToggle();
  followHostIfNeeded();          // ON にした瞬間ホストへスナップ（一致済み/追従不能なら no-op）
}

// チップの手動クリック = 明示的なナビゲーション。追従を解除してから切り替える。
// switchToDataset は追従とも共有する原子操作なので、解除はここに閉じる。
function chipClick(dsKey) {
  followTarget = "none";
  renderFollowToggle();
  switchToDataset(dsKey);        // 同一DSクリックは switchToDataset 先頭のガードで no-op
}

// 追従の単一判定点。poll（毎周期）と toggleFollow（ON 直後のスナップ）の両方がここだけを通る。
// 切替を発行したら true（poll は自分のポールを stale として捨てる）。
// dsChips に無いキーへは飛ばない: ホストの active_dataset が共有チップ集合の外にある場合、
// 追従 →「現DSが消えた」安全弁 → 追従 … と毎ポール往復して view キャッシュを焼き続けるため。
// 現行の relay ではこの分岐は発火しない（active_dataset は必ず datasets に含まれる）。将来
// relay 側に DS 単位のオプトアウトが入ったときの防御で、そのときは追従が無言で no-op になる。
function followHostIfNeeded() {
  if (followTarget !== "host" || hostActiveDs === undefined) return false;
  const key = hostActiveDs ?? "";
  if ((curDs ?? "") === key || !dsChips.includes(key)) return false;
  switchToDataset(key);
  return true;
}

// Switch to a dataset (wire key; "" = null group). The shared switch primitive:
// chipClick (manual nav) and followHostIfNeeded (opt-in host tracking, Issue #80)
// both funnel through it, so it must NOT touch followTarget — dropping the tracking
// is chipClick's job alone. The leading same-DS guard is a contract chipClick relies
// on. Remembers the current DS's tab/session selection AND the unsent #msg draft
// (draftByDs, Issue #80: with the toggle on a host switch would otherwise re-target
// the guest's half-typed message at another DS's session), resets the per-DS view
// caches (onDatasetSwitch), and nulls curSid/cur so the immediate poll(true)
// bootstraps with sid "_" (never pulls the old DS's messages into the new DS's
// store). The new DS's session is chosen by renderSessions auto-select.
function switchToDataset(dsKey) {
  const target = dsKey === "" ? null : dsKey;
  if ((curDs ?? "") === dsKey) return;
  if (curTab) selTabByDs[curDs ?? ""] = curTab;
  if (curSid) selSidByDs[curDs ?? ""] = curSid;
  const ta = document.getElementById("msg");
  draftByDs[curDs ?? ""] = ta.value;      // 未送信ドラフトを現DSに退避（Issue #80）
  ta.value = draftByDs[dsKey] ?? "";      // 新DSの退避分を復元（無ければ空）
  curSid = null;
  cur = null;
  curDs = target;
  onDatasetSwitch();
  maybePresence(true);
  poll(true);
}

// Dataset-scoped state swap: same-named tabs in the new dataset are DIFFERENT
// tabs — every per-tab cache resets and in-flight fetches must not paint.
// viewInflight is NOT cleared: its keys are generation-scoped ("gen:tab"), so
// stale entries self-delete when their fetch settles (a wholesale clear would
// let an old fetch's finally release a NEW fetch's de-dupe marker).
function onDatasetSwitch() {
  viewGen++;
  for (const k of Object.keys(appliedVv)) delete appliedVv[k];
  lastViewVersions = {};
  curTab = null;                 // renderTabs re-selects (selTabByDs preferred)
  resetView();
  clearViewImage(T.switchingDs);
}

function clearViewImage(text) {
  const img = document.getElementById("view");
  const old = img.dataset.url;
  img.removeAttribute("src");
  delete img.dataset.url;        // Copy/Download guard keys on dataset.url — must trip
  if (old) URL.revokeObjectURL(old);
  const ph = document.getElementById("viewEmpty");
  ph.textContent = text || "";
  ph.style.display = "";
}

function renderTabs(tabs) {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  for (const name of tabs) {
    const b = document.createElement("button");
    b.className = "tabbtn" + (name === curTab ? " active" : "");
    b.textContent = name;
    b.onclick = () => {
      curTab = name;
      selTabByDs[curDs ?? ""] = name;   // remember per dataset (switch-back restore)
      resetView();                // start fitted on the new figure (zoom/pan persist across images)
      delete appliedVv[curTab];   // force re-fetch of the new tab (img is shared); use updated curTab, not loop var
      renderTabs(tabs);
      maybePresence(true);
      fetchView();
    };
    b.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); showTabMenu(e, name); };
    bar.appendChild(b);
  }
  if (!curTab && tabs.length) {
    const remembered = selTabByDs[curDs ?? ""];
    curTab = tabs.includes(remembered) ? remembered : tabs[0];
    resetView();
    delete appliedVv[curTab];
    fetchView();
  }
  // A dataset with zero shared tabs: no fetch will ever replace the placeholder,
  // so swap the "loading" text for a neutral empty state (idempotent per poll).
  // Also drop the selection (remembering it for restore): a stale-truthy curTab
  // would skip the bootstrap on a later re-share — with unchanged pixels vv never
  // bumps either, so nothing would ever repaint and the placeholder would stick
  // forever — and would let an in-flight fetch paint an unshared tab's frame.
  if (!tabs.length) {
    if (curTab) { selTabByDs[curDs ?? ""] = curTab; curTab = null; }
    clearViewImage(T.noTabs);
  }
}

// ---- live view ----
// Only advance appliedVv on a version we actually decoded+painted, so a failed
// fetch/decode is retried by the next poll instead of sticking the view (cause E).
function applyViewVersions(vv) {
  lastViewVersions = vv;
  if (curTab && vv[curTab] && vv[curTab] !== appliedVv[curTab]) fetchView(vv[curTab]);
}

async function fetchView(targetVer) {
  if (!curTab || stopped) return;
  const tab = curTab;
  const g = viewGen;                                  // dataset-switch generation guard
  const key = g + ":" + tab;                          // de-dupe scoped per generation
  const ver = (targetVer != null) ? targetVer : (lastViewVersions[tab] || 0);
  if (viewInflight.has(key)) return;                  // de-dupe concurrent fetches per tab
  viewInflight.add(key);
  try {
    const r = await api("/view/" + encodeURIComponent(cfg.channel) + "/" + encodeURIComponent(tab) +
                        "?ds=" + encodeURIComponent(curDs ?? ""),
                        { expect: "blob" });
    if (r.status === 401 || r.status === 410) { selfDestruct(); return; }
    if (r.status === 204 || !r.ok || !r.data) return; // transient: don't advance appliedVv → next poll retries
    const url = URL.createObjectURL(r.data);
    // Wait for decode. A corrupt/empty PNG fires onerror and we leave appliedVv
    // unadvanced (reviewer P2) so the view doesn't stick on a broken frame.
    const decoded = await new Promise((resolve) => {
      const probe = new Image();
      probe.onload = () => resolve(true);
      probe.onerror = () => resolve(false);
      probe.src = url;
    });
    // g !== viewGen: the host switched datasets mid-fetch — a same-named tab in
    // the new dataset is a DIFFERENT tab, so this frame must never paint.
    if (!decoded || tab !== curTab || g !== viewGen || stopped) {
      URL.revokeObjectURL(url);                        // release the new URL (leak guard)
      return;                                          // appliedVv unadvanced → next poll retries
    }
    const img = document.getElementById("view");
    const old = img.dataset.url;
    img.src = url;                                     // already decoded → instant paint
    img.dataset.url = url;
    if (old) URL.revokeObjectURL(old);                // revoke old URL synchronously (no onload race; reviewer P2-2)
    appliedVv[tab] = ver;                             // advance only on a painted frame
    document.getElementById("viewEmpty").style.display = "none";
  } catch (e) { /* transient: appliedVv unadvanced → next poll retries */ }
  finally { viewInflight.delete(key); }
}

// ---- zoom / pan ----
let scale = 1, panX = 0, panY = 0;
function applyTransform() {
  const img = document.getElementById("view");
  img.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById("zoomInfo").textContent = Math.round(scale * 100) + "%";
}
// Reset to the fitted whole-figure view. The host now sends the full figure
// (decoupled from its own zoom/pan), so "fit" = scale 1 / no pan shows everything.
function resetView() { scale = 1; panX = 0; panY = 0; applyTransform(); }
function setupViewer() {
  const wrap = document.getElementById("canvaswrap");
  wrap.title = T.viewHint;   // full figure is decoupled from the host's view
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    scale = Math.min(20, Math.max(0.1, scale * f));
    applyTransform();
  }, { passive: false });
  let dragging = false, sx = 0, sy = 0;
  wrap.addEventListener("mousedown", (e) => { dragging = true; sx = e.clientX - panX; sy = e.clientY - panY; });
  window.addEventListener("mousemove", (e) => { if (dragging) { panX = e.clientX - sx; panY = e.clientY - sy; applyTransform(); } });
  window.addEventListener("mouseup", () => { dragging = false; });
  wrap.addEventListener("dblclick", () => resetView());   // recover a lost/over-panned view
  applyTransform();
}

// ---- image copy / download (feature-detect clipboard) ----
function setupImageButtons() {
  const dl = document.getElementById("dlBtn");
  dl.onclick = () => {
    const img = document.getElementById("view");
    if (!img.dataset.url) return;
    const a = document.createElement("a");
    a.href = img.dataset.url; a.download = (curTab || "view") + ".png"; a.click();
  };
  const copy = document.getElementById("copyBtn");
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) {
    copy.style.display = "none";
    return;
  }
  copy.onclick = async () => {
    const img = document.getElementById("view");
    if (!img.dataset.url) return;
    try {
      const blob = await (await fetch(img.dataset.url)).blob();
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    } catch (e) { /* ignore */ }
  };
}

// ---- resizable splitter (guest-controlled chat width) ----
const RIGHT_W_DEFAULT = 380, RIGHT_W_MIN = 220;
const RIGHT_W_KEY = "ma_right_w";
function clampRightW(w) {
  return Math.max(RIGHT_W_MIN, Math.min(w, Math.round(window.innerWidth * 0.7)));
}
function applyRightW(w) {
  document.getElementById("cols").style.setProperty("--right-w", clampRightW(w) + "px");
}
function setupSplitter() {
  const cols = document.getElementById("cols");
  const sp = document.getElementById("splitter");
  // restore persisted width
  const saved = parseInt(localStorage.getItem(RIGHT_W_KEY) || "", 10);
  if (Number.isFinite(saved)) applyRightW(saved);
  let dragging = false;
  sp.addEventListener("pointerdown", (e) => {
    dragging = true;
    sp.setPointerCapture(e.pointerId);
    sp.classList.add("dragging");
    document.body.classList.add("resizing");
    e.preventDefault();
  });
  sp.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    applyRightW(cols.getBoundingClientRect().right - e.clientX);
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    try { sp.releasePointerCapture(e.pointerId); } catch (_) {}
    sp.classList.remove("dragging");
    document.body.classList.remove("resizing");
    const cur = parseInt(cols.style.getPropertyValue("--right-w"), 10);
    if (Number.isFinite(cur)) localStorage.setItem(RIGHT_W_KEY, String(cur));
  };
  sp.addEventListener("pointerup", end);
  sp.addEventListener("pointercancel", end);
  // double-click → reset to default
  sp.addEventListener("dblclick", () => {
    localStorage.removeItem(RIGHT_W_KEY);
    applyRightW(RIGHT_W_DEFAULT);
  });
  // re-clamp on window resize (e.g. stored width now exceeds 70vw)
  window.addEventListener("resize", () => {
    const cur = parseInt(cols.style.getPropertyValue("--right-w"), 10);
    if (Number.isFinite(cur)) applyRightW(cur);
  });
}
