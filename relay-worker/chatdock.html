// ---- tab context menu (解析タブ右クリック: タブ名コピー / このタブにコメント) ----
let ctxTab = null;                 // 右クリック対象のタブ名（メニューを閉じると null）
function showTabMenu(e, name) {
  ctxTab = name;
  const menu = document.getElementById("ctxmenu");
  menu.style.display = "block";
  const mw = menu.offsetWidth, mh = menu.offsetHeight;   // 表示後に実寸を測りビューポート内へ収める
  menu.style.left = Math.max(0, Math.min(e.clientX, window.innerWidth - mw - 4)) + "px";
  menu.style.top  = Math.max(0, Math.min(e.clientY, window.innerHeight - mh - 4)) + "px";
}
function hideTabMenu() {
  const menu = document.getElementById("ctxmenu");
  if (menu) menu.style.display = "none";
  ctxTab = null;
}

// タブ名をクリップボードへ（execCommand フォールバック付き＝非セキュアコンテキスト対応）。
function copyTabName(name) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(name); return; }
  } catch (e) { /* fall through to legacy path */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = name; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) { /* ignore */ }
}

// 入力欄の冒頭に「このタブへのコメント」だと分かる機械的な接頭辞を差し込み、入力へフォーカス。
// 送信メッセージがその接頭辞で始まるので、ホスト側でどのタブへのコメントか一目で分かる。
function commentOnTab(name) {
  const ta = document.getElementById("msg");
  if (!ta) return;
  const prefix = T.tabCommentPrefix.replace("{name}", () => name);   // 関数置換＝name 内の $ を無効化
  if (!ta.value.startsWith(prefix)) ta.value = prefix + ta.value;    // 二重付与は防ぐ
  ta.focus();
  const end = ta.value.length;
  try { ta.setSelectionRange(end, end); } catch (e) {}
}

function setupTabMenu() {
  const copyEl = document.getElementById("ctxCopyName");
  const cmtEl  = document.getElementById("ctxComment");
  copyEl.textContent = T.copyTabName;
  cmtEl.textContent  = T.commentOnTab;
  // ctxTab はメニューを閉じる前に捕まえる（hideTabMenu が null にするため）。
  copyEl.onclick = () => { const t = ctxTab; hideTabMenu(); if (t) copyTabName(t); };
  cmtEl.onclick  = () => { const t = ctxTab; hideTabMenu(); if (t) commentOnTab(t); };
  // メニュー外の左クリック・別所での右クリック・Esc・リサイズで閉じる
  // （タブ上の右クリックは stopPropagation 済みなので document には届かない）。
  document.addEventListener("click", hideTabMenu);
  document.addEventListener("contextmenu", hideTabMenu);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTabMenu(); });
  window.addEventListener("resize", hideTabMenu);
}

// ---- send ----
async function send() {
  if (!curSid || stopped) return;
  const ta = document.getElementById("msg");
  const text = ta.value;
  if (!text.trim()) return;
  ta.value = "";
  const state = cur;
  // Own message lives in the store (mine, status) so it survives session switches;
  // its mid is filled on ack to dedup the /poll echo.
  const m = { mid: null, text, name: myName || "Guest", role: "user", mine: true, status: "sending" };
  appendMsg(state, m);
  try {
    const r = await api("/msg/" + encodeURIComponent(cfg.channel) + "/" + encodeURIComponent(curSid) +
      (curDs !== undefined ? "?ds=" + encodeURIComponent(curDs ?? "") : ""),
      { method: "POST", body: { text, name: myName || "Guest" } });
    if (r.status === 401 || r.status === 410) { selfDestruct(); markFailed(state, m, false); return; }
    if (r.ok && r.data && r.data.mid) {
      m.mid = r.data.mid;
      state.have.add(r.data.mid);    // dedup our own echo from /poll
      setMsgStatus(m, "sent", T.sent);
      return;
    }
    markFailed(state, m, true);      // !ok / 503 / missing mid → retryable
  } catch (e) {
    markFailed(state, m, true);      // body stall / abort / network → retryable
  }
}

// retryable=false (401/410, channel dead, selfDestruct done) → no resend button.
function markFailed(state, m, retryable) {
  setMsgStatus(m, "failed", T.sendFail);   // keep the same span (so a later resend can show ✓)
  if (!retryable || !m._el) return;
  const btn = document.createElement("button");
  btn.className = "resend";
  btn.textContent = T.resend;
  btn.onclick = async () => {
    btn.remove();
    setMsgStatus(m, "sending", T.sending);
    try {
      const r = await api("/msg/" + encodeURIComponent(cfg.channel) + "/" + encodeURIComponent(curSid) +
        (curDs !== undefined ? "?ds=" + encodeURIComponent(curDs ?? "") : ""),
        { method: "POST", body: { text: m.text, name: myName || "Guest" } });
      if (r.status === 401 || r.status === 410) { selfDestruct(); markFailed(state, m, false); return; }
      if (r.ok && r.data && r.data.mid) {
        m.mid = r.data.mid;
        state.have.add(r.data.mid);
        setMsgStatus(m, "sent", T.sent);
        return;
      }
      markFailed(state, m, true);
    } catch (e) { markFailed(state, m, true); }
  };
  m._el.appendChild(btn);
}

// ---- join ----
function join(tok, name) {
  try {
    cfg = decodeToken(tok);
  } catch (e) {
    document.getElementById("enterErr").textContent = T.badToken;
    return;
  }
  myName = (name || "").trim() || "Guest";
  try {
    const chk = document.getElementById("rememberChk");
    if (chk && chk.checked) {
      localStorage.setItem("myanalysis_guest_name", myName);
      localStorage.setItem("myanalysis_guest_token", (tok || "").trim());
    } else {
      localStorage.removeItem("myanalysis_guest_name");
      localStorage.removeItem("myanalysis_guest_token");
    }
  } catch (e) {}
  pid = genPid();
  document.getElementById("enter").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("status").textContent = T.connecting;
  setupViewer();
  setupImageButtons();
  setupSplitter();
  setupTabMenu();
  document.getElementById("sendBtn").onclick = send;
  document.getElementById("histBtn").onclick = loadHistory;
  setupToolDisplaySel();
  updateHistBtn();
  document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  // Page Visibility: on resume, reanchor (since omitted) to jump cleanly to
  // "now" using the worker clock — never local Date.now().
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !stopped) {
      if (pollTimer) clearTimeout(pollTimer);
      poll(true);
    }
  });
  poll(true); // initial reanchor poll
}

// ---- self-test (#selftest): renderMarkdown の安全性/正当性をブラウザで決定論的に検証。
// join せず・リレー接続せず、フィクスチャへ適用して assert する。通常運用には影響しない。 ----
async function runSelfTest() {
  const cases = [];
  const check = (name, cond) => cases.push({ name, pass: !!cond });
  let r;
  // #selftest は join() を通らないので cfg が null のまま。URL 組立
  // ("/poll/" + encodeURIComponent(cfg.channel) 等) は api stub に入る前の
  // 引数式で評価されるため、スタブを張らないと TypeError が catch に飲まれて
  // ブロック9 の 7 件が必ず FAIL する（Issue #81 で修復）。
  // api も同じ位置で stub する: maybePresence() には stopped ガードが無く、
  // 9b/9d が force 呼びするので、cfg だけ張ると実 fetch が飛んで見出しの
  // 「join せず・リレー接続せず」が偽になる。9e-9g とブロック10 の自前退避とは
  // そのまま合成できる。
  const _cfgSave = cfg, _apiSave = api;
  cfg = { base_url: "", channel: "ch1", secret: "s" };
  api = () => Promise.resolve({ status: 503, ok: false, data: {} });
  try {
    // 1. XSS 無害化: onerror 付き実 <img> を生成しない（エスケープ済みテキストとして現れる）。
    r = renderMarkdown("<img src=x onerror=alert(1)>");
    check("xss-img", !/<img[^>]*onerror/i.test(r) && r.indexOf("&lt;img") !== -1);
    // 2. URL allowlist: javascript: は弾く（大文字混在も）、https: は許可リンク化。
    r = renderMarkdown("[x](javascript:alert(1))");
    check("xss-js-link", !/href=["']?javascript/i.test(r));
    r = renderMarkdown("[x](jaVasCript:alert(1))");
    check("xss-js-link-mixed", !/href=["']?javascript/i.test(r));
    r = renderMarkdown("[ok](https://example.com)");
    check("ok-https-link", /<a href="https:\/\/example\.com">ok<\/a>/.test(r));
    // 3. コードフェンス特殊文字: $1/$$ は置換変数として誤消費されず literal 保持、& は正しく
    //    エスケープ（$&amp;）、< は &lt; 化（実 <b> タグにならない）。
    r = renderMarkdown("```\n$1 $& $$ <b>\n```");
    check("code-dollar", r.indexOf("$1") !== -1 && r.indexOf("$$") !== -1 && r.indexOf("$&amp;") !== -1);
    check("code-lt", r.indexOf("&lt;b&gt;") !== -1 && r.indexOf("<b>") === -1);
    // 4. プレースホルダ/センチネル衝突: 入力にセンチネル相当が含まれても誤マッチしない。
    r = renderMarkdown("plain \u0000 0 \u0000 text **bold**");
    check("sentinel-no-collide", /<strong>bold<\/strong>/.test(r));
    // 5. 構造パース回帰防止: 見出し/リストが実タグへ、スペースが保持されること
    //    （sentinel は NUL のためスペースは無傷。過去に「全スペース削除」と誤読された箇所の回帰網）。
    r = renderMarkdown("# Heading\n- Item 1\n- Item 2");
    check("header-parsed", /<h1>Heading<\/h1>/.test(r));
    check("list-parsed", /<ul><li>Item 1<\/li><li>Item 2<\/li><\/ul>/.test(r));
    check("space-preserved", renderMarkdown("a b c").indexOf("a b c") !== -1);
    // 6. never-throw: 未閉じフェンス/未閉じ強調/null でも例外を投げず文字列を返す。
    let threw = false;
    try {
      [renderMarkdown("```\nunclosed **bold _italic"), renderMarkdown("**"), renderMarkdown(null)]
        .forEach((x) => { if (typeof x !== "string") threw = true; });
    } catch (e) { threw = true; }
    check("never-throw", !threw);
    // 7. DS切替の状態リセット: 世代++・per-tab キャッシュ全消去・選択解除・画像クリア
    //    （dataset.url が消え Copy/Download ガードが効く）・プレースホルダ表示。
    //    viewInflight は世代キーのため onDatasetSwitch では消さない（自滅する）。
    appliedVv["t1"] = 5;
    lastViewVersions = { t1: 5 };
    curTab = "t1";
    const g0 = viewGen;
    const vimg = document.getElementById("view");
    vimg.dataset.url = "blob:fake";
    onDatasetSwitch();
    check("ds-switch-reset",
          viewGen === g0 + 1 && Object.keys(appliedVv).length === 0 &&
          Object.keys(lastViewVersions).length === 0 && curTab === null &&
          !vimg.dataset.url &&
          document.getElementById("viewEmpty").style.display !== "none");

    // 8. ツール集約(simplifyToolText)の host パリティ + 表示経路の literal 化(語中 _ 誤強調防止)。
    r = simplifyToolText("🔧 Read  a.py\n   ↳ x\n🔧 Grep  q\n   ↳ y\n🔧 Read  b.py", "compact");
    check("st-compact-aggregate", r === "🔧 Read · Grep · Read");                  // 行A: 順序・重複保持
    r = simplifyToolText("🔧 A  x\n\n   ↳ r\n\n🔧 B  y", "compact");
    check("st-compact-blank-absorb", r === "🔧 A · B");                            // 行B: run 内空行吸収→1 run
    {
      const rc = simplifyToolText("pre\n🔧 A  x\n   ↳ r\nmid\n🔧 B  y\n   ↳ s\npost", "compact")
                 .split("\n").filter((l) => l.startsWith(TOOL_CALL_MARKER + " "));
      check("st-compact-prose-split", rc.length === 2 && rc[0] === "🔧 A" && rc[1] === "🔧 B");  // 行C: run 境界
    }
    r = simplifyToolText("🔧 write_file  path=b.py", "compact");
    check("st-compact-single", r === "🔧 write_file");                            // 行D: 単一呼び出し・区切り無し
    r = simplifyToolText("intro\n   ↳ r1\n   ↳ r2\nend", "compact");
    check("st-compact-resultonly-drop",                                           // 行E: 結果のみ run は guest では出さない
          r.indexOf("↳") === -1 && r.indexOf("intro") !== -1 && r.indexOf("end") !== -1);
    r = renderMarkdown("🔧 read_file · write_file");                              // 表示経路: 語中 _ を強調化しない
    check("st-toolline-literal",
          r.indexOf("<em>") === -1 && r.indexOf("<strong>") === -1 &&
          r.indexOf("read_file · write_file") !== -1);
    // 9. Issue #78/#80: DSナビゲーション。クリック可能DSバー・現DSフィルタ・0セッション
    //    リセット・switchToDataset の sid/cur null 化とドラフト退避・「ホストに追従」トグルの
    //    状態遷移・poll の追従判定と stale poll 中断。副作用は stopped と stub で無効化。
    {
      const _save = { curDs, curSid, cur, curTab, stopped, followTarget, hostActiveDs, dsChips };
      stopped = true;    // poll()/schedulePoll() を no-op 化（fetch を発火させない）
      // 9a. renderDatasetBar: 全DSをクリック可能ボタン化し curDs（?? ""）をハイライト。
      curDs = "dsB";
      renderDatasetBar(["dsA", "dsB", ""]);
      const dsbtns = document.getElementById("dsBar").querySelectorAll("button.tabbtn");
      check("ds-bar-clickable",
            dsbtns.length === 3 && dsbtns[1].classList.contains("active") &&
            !dsbtns[0].classList.contains("active") &&
            dsbtns[2].textContent.indexOf(T.noDataset) !== -1 &&
            typeof dsbtns[0].onclick === "function");
      // null グループのハイライトは curDs ?? "" 経由。
      curDs = null;
      renderDatasetBar(["dsA", ""]);
      const dsbtns2 = document.getElementById("dsBar").querySelectorAll("button.tabbtn");
      check("ds-bar-null-highlight",
            dsbtns2[1].classList.contains("active") && !dsbtns2[0].classList.contains("active"));
      // 9b. renderSessions: (s.dataset ?? "") で現DSにフィルタし、現DSの先頭を auto-select。
      store.clear();
      curDs = "dsA"; curSid = null; cur = null;
      renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                      { id: "b1", title: "B1", busy: false, dataset: "dsB" }]);
      const sessbtns = document.getElementById("sessionBar").querySelectorAll("button");
      // Issue #81: 末尾に「+」（新規チャット）が常に付くので、セッションタブは length-1 個。
      // 件数だけでなく末尾が "+" であることも見る（"+" の位置を動かしたら気づけるように）。
      check("sess-ds-filter", sessbtns.length === 2 &&
            sessbtns[sessbtns.length - 1].textContent === "+" && curSid === "a1");
      // 9c. 0セッションDSへ切替: curSid/cur を null 化・chatlog を空リセット。
      curDs = "dsB"; curSid = "a1"; cur = getState("a1");
      document.getElementById("chatlog").innerHTML = "<div>stale</div>";
      renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" }]);
      check("sess-empty-ds-reset",
            curSid === null && cur === null &&
            document.getElementById("chatlog").innerHTML === "");
      // 9d. switchToDataset: 選択記憶の直後に curSid/cur を null 化（DS切替 poll が sid "_"）。
      store.clear();
      curDs = "dsA"; curSid = "a1"; cur = getState("a1"); curTab = "t1";
      switchToDataset("dsB");
      check("switch-nulls-sid",
            curSid === null && cur === null && curDs === "dsB" &&
            selSidByDs["dsA"] === "a1" && selTabByDs["dsA"] === "t1");
      // 同一DSへの switch は no-op（poll を発火しない）。
      curSid = "keep";
      switchToDataset("dsB");
      check("switch-noop-same", curSid === "keep");
      // 9h. Issue #80「ホストに追従」トグル: 宣言時の既定OFF・OFF時の見た目・再描画耐性・
      //     ON 表示・チップクリックでの解除。
      //     curDs === hostActiveDs にしてある間は switchToDataset は発火しない。
      const ftEl = document.getElementById("followToggle");
      followTarget = "none"; hostActiveDs = "dsA"; curDs = "dsA"; dsChips = ["dsA", "dsB"];
      renderDatasetBar(dsChips);
      check("follow-toggle-renders-off",
            _save.followTarget === "none" &&          // 宣言時の既定（誰も永続復元していない）
            !ftEl.classList.contains("on") &&
            ftEl.textContent.indexOf(T.followHost) !== -1 &&
            ftEl.textContent.indexOf(": OFF") !== -1 &&
            ftEl.title === T.followHostHint && T.followHostHint.length > 0);
      // チップ再描画でトグルが消えない・重複しない・常に最終子（右端）に残る。
      renderDatasetBar(dsChips);
      check("follow-toggle-survives-rerender",
            document.getElementById("dsBar").querySelectorAll("#followToggle").length === 1 &&
            document.getElementById("dsBar").lastElementChild === ftEl &&
            document.getElementById("dsBar").querySelectorAll("button.tabbtn").length === 2);
      toggleFollow();
      check("follow-toggle-on",
            followTarget === "host" && ftEl.classList.contains("on") &&
            ftEl.textContent.indexOf(": ON") !== -1 && curDs === "dsA");
      // チップの手動クリックで解除。この check は 9e-9g の前提（followTarget === "none"）が
      // 成立していることの保証も兼ねる。
      chipClick("dsA");                                  // 同一DS＝switchToDataset は no-op
      check("follow-chip-click-drops",
            followTarget === "none" && !ftEl.classList.contains("on") && curDs === "dsA");
      // 9i. Issue #80: DS 切替で #msg の未送信ドラフトが DS ごとに退避/復元される
      //     （追従・手動の両方が switchToDataset を通るので、そこで一括して守る）。
      const taEl = document.getElementById("msg");
      for (const k of Object.keys(draftByDs)) delete draftByDs[k];   // 9d の書き込みを消す
      store.clear();
      curDs = "dsA"; curSid = "a1"; cur = getState("a1"); curTab = null;
      taEl.value = "draft-A";
      switchToDataset("dsB");
      check("draft-stashed-on-switch",
            taEl.value === "" && draftByDs["dsA"] === "draft-A");
      taEl.value = "draft-B";
      switchToDataset("dsA");
      check("draft-restored-on-switch-back",
            taEl.value === "draft-A" && draftByDs["dsB"] === "draft-B");
      taEl.value = "";

      // 9e/9f/9g. poll/presence の安全弁を api/schedulePoll を stub 化して検査（reviewer P2）:
      // bootstrap での ds 省略・0セッションDSでの送信無効化・現DSスコープの opt-out。
      const _api = api, _sched = schedulePoll;
      let capUrl = null, capBody = null;
      let pollResp = { status: 503, ok: false, data: {} };
      api = (u, opts) => { capUrl = u; capBody = opts && opts.body; return Promise.resolve(pollResp); };
      schedulePoll = () => {};
      try {
        // 9e. maybePresence: bootstrap(curDs===undefined)は body に ds を載せない、
        //     確定時は ds（null群は "")。body は await 前に組まれるので同期捕捉できる。
        lastPresenceMs = 0; curDs = undefined; curSid = "s1"; curTab = null;
        maybePresence(true);
        check("presence-bootstrap-omits-ds", !!capBody && !("ds" in capBody));
        lastPresenceMs = 0; curDs = "dsA"; maybePresence(true);
        check("presence-includes-ds", !!capBody && capBody.ds === "dsA");
        lastPresenceMs = 0; curDs = null; maybePresence(true);
        check("presence-null-group-ds", !!capBody && capBody.ds === "");
        // 9f. poll URL: bootstrap は ds を付けない・確定時は &ds=<enc>（503 で副作用前に return）。
        stopped = false;
        curDs = undefined; curSid = null; cur = null;
        await poll(false);
        check("poll-bootstrap-omits-ds", !!capUrl && capUrl.indexOf("ds=") === -1);
        curDs = "dsA"; curSid = "s1"; cur = getState("s1");
        await poll(false);
        check("poll-includes-ds", !!capUrl && capUrl.indexOf("&ds=dsA") !== -1);
        // 9g. poll 本処理: 0セッションDSは curSid を null 化し送信無効＋noSessionsInDataset、
        //     現DSに sid が有れば（他DS sid は現DSフィルタで除外され）送信有効。
        const mkResp = (sessions) => ({ status: 200, ok: true, data: {
          sessions, tabs: [], view_versions: {}, datasets: ["dsA", "dsB"],
          active_dataset: "dsA", messages: [], server_now_ms: 1 } });
        followTarget = "none";   // 9g は独立モード前提（9h が host にしたまま来ても壊れない）
        store.clear();
        curDs = "dsB"; curSid = "x"; cur = getState("x"); curTab = null; optOutStrikes = 0;
        pollResp = mkResp([{ id: "a1", title: "A1", busy: false, dataset: "dsA" }]);
        await poll(false);
        check("poll-empty-ds-disables-send",
              curSid === null &&
              document.getElementById("sendBtn").disabled === true &&
              document.getElementById("sessNotice").textContent === T.noSessionsInDataset);
        curDs = "dsA"; curSid = "a1"; cur = getState("a1"); optOutStrikes = 0;
        pollResp = mkResp([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                           { id: "b1", title: "B1", busy: false, dataset: "dsB" }]);
        await poll(false);
        check("poll-current-ds-sid-keeps-send",
              document.getElementById("sendBtn").disabled === false);
        // 9j. Issue #80: poll の追従判定と、追従時に stale poll を中断すること。
        //     switchToDataset は stub 化（実で回すと下記カスケードで暴走タイマを生む）。
        //     番兵: 追従して return した周では renderSessions が走らない＝番兵が残る。
        //     追従しない周では renderSessions の innerHTML="" で番兵が消える（空振り防止）。
        const _switch = switchToDataset;
        let switchArg;
        switchToDataset = (k) => { switchArg = k; };   // function 宣言＝再代入可（api/schedulePoll と同じ）
        try {
          const SENT = "<i>sentinel</i>";
          const sessBar = document.getElementById("sessionBar");
          const mkRespDs = (active) => ({ status: 200, ok: true, data: {
            sessions: [{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                       { id: "b1", title: "B1", busy: false, dataset: "dsB" }],
            tabs: [], view_versions: {}, datasets: ["dsA", "dsB"],
            active_dataset: active, messages: [], server_now_ms: 1 } });
          // OFF: ホストが dsB を見ていてもゲストは動かない（独立）。描画は通常どおり走る。
          store.clear();
          followTarget = "none"; curDs = "dsA"; curSid = "a1"; cur = getState("a1");
          curTab = null; optOutStrikes = 0;
          switchArg = undefined; pollResp = mkRespDs("dsB"); sessBar.innerHTML = SENT;
          await poll(false);
          check("follow-off-poll-independent",
                switchArg === undefined && curDs === "dsA" && hostActiveDs === "dsB" &&
                sessBar.innerHTML !== SENT);
          // ON: ホストの dsB へ切替を決め、そのポールは描画せず return する。
          followTarget = "host"; curDs = "dsA"; curSid = "a1"; cur = getState("a1");
          optOutStrikes = 0;
          switchArg = undefined; pollResp = mkRespDs("dsB"); sessBar.innerHTML = SENT;
          await poll(false);
          check("follow-on-poll-switches",
                switchArg === "dsB" && sessBar.innerHTML === SENT);
          // ON でもチップ一覧に無いDSへは飛ばない（安全弁との毎ポール往復を断つガード）。
          // 現行 relay では active_dataset は必ず datasets に含まれるので実運用では起きない
          // 状態を、ガードが将来も残ることを保証するために合成している（設計判断4）。
          followTarget = "host"; curDs = "dsA"; curSid = "a1"; cur = getState("a1");
          optOutStrikes = 0;
          switchArg = undefined; pollResp = mkRespDs("dsZ"); sessBar.innerHTML = SENT;
          await poll(false);
          check("follow-on-poll-skips-unlisted",
                switchArg === undefined && curDs === "dsA" && hostActiveDs === "dsZ" &&
                sessBar.innerHTML !== SENT);
        } finally {
          switchToDataset = _switch;
        }
      } finally {
        api = _api; schedulePoll = _sched;
      }

      stopped = _save.stopped; curDs = _save.curDs; curSid = _save.curSid;
      cur = _save.cur; curTab = _save.curTab; followTarget = _save.followTarget;
      hostActiveDs = _save.hostActiveDs; dsChips = _save.dsChips;
    }

    // 10. Issue #81: ゲスト発の「新規チャット」。セッションバー末尾の "+"・0セッション
    //     DSでも出ること・null グループでの無効化・POST の URL/body・二重押下抑止・
    //     pendingNewSelect の差分検出による自動選択・DS不一致/期限切れ/スナップショット
    //     古さの扱い。api/schedulePoll は stub 化して副作用を止める。
    {
      const _save = { curDs, curSid, cur, curTab, stopped, myName,
                      pendingNewSelect, newSessionInflight, statusOverride,
                      lastFilteredSids, lastFilteredDs };
      const _api = api, _sched = schedulePoll;
      const calls = [];
      stopped = false;
      myName = "Zoe";
      schedulePoll = () => {};
      // /newsession だけ 200、他（poll/presence）は 503 にして本処理前に return させる。
      api = (u, opts) => {
        calls.push({ u, body: opts && opts.body });
        return Promise.resolve(u.indexOf("/newsession/") !== -1
          ? { status: 200, ok: true, data: { ok: true, mid: "m1" } }
          : { status: 503, ok: false, data: {} });
      };
      const nposts = () => calls.filter((c) => c.u.indexOf("/newsession/") !== -1).length;
      try {
        // 10a. セッションが有る DS: 末尾に "+" が1つだけ付く。
        store.clear();
        curDs = "dsA"; curSid = null; cur = null;
        pendingNewSelect = null; newSessionInflight = false; statusOverride = null;
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" }]);
        let btns = document.getElementById("sessionBar").querySelectorAll("button");
        check("newchat-btn-present",
              btns.length === 2 && btns[1].textContent === "+" &&
              btns[1].title === T.newChat && T.newChat.length > 0 &&
              btns[1].disabled === false);
        // 10b. 0セッションDSでも "+" は残る（最初の1件を作れる）。
        curDs = "dsZ"; curSid = null; cur = null;
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" }]);
        btns = document.getElementById("sessionBar").querySelectorAll("button");
        check("newchat-btn-zero-sessions", btns.length === 1 && btns[0].textContent === "+");
        // 10c. null グループでは無効化され、理由がツールチップに出る。押しても POST しない。
        curDs = null; curSid = null; cur = null;
        renderSessions([{ id: "z1", title: "Z1", busy: false, dataset: null }]);
        btns = document.getElementById("sessionBar").querySelectorAll("button");
        const addNull = btns[btns.length - 1];
        calls.length = 0;
        await newSession();
        check("newchat-btn-null-ds-disabled",
              addNull.textContent === "+" && addNull.disabled === true &&
              addNull.title === T.newChatNullDs && T.newChatNullDs.length > 0 &&
              nposts() === 0 && pendingNewSelect === null);
        // 10d. newSession(): POST /newsession/{ch}?ds= + body.name、現DSの既知id集合で予約。
        store.clear();
        curDs = "dsA"; curSid = "a1"; cur = getState("a1"); statusOverride = null;
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" }]);
        calls.length = 0;
        await newSession();
        const post = calls.find((c) => c.u.indexOf("/newsession/") !== -1);
        check("newchat-post",
              !!post && post.u.indexOf("/newsession/ch1") !== -1 &&
              post.u.indexOf("ds=dsA") !== -1 &&
              !!post.body && post.body.name === "Zoe" &&
              newSessionInflight === false &&
              !!statusOverride && statusOverride.text === T.newChatPending &&
              !!pendingNewSelect && pendingNewSelect.ds === "dsA" &&
              pendingNewSelect.select === true && pendingNewSelect.before.has("a1"));
        // 10e. 予約が生きている間の再押下は POST を増やさない（二重作成防止）。
        await newSession();
        check("newchat-double-press-one-post", nposts() === 1);
        // 10f. before に無い id が現DSに現れたら自動選択し、予約と「作成中…」を解除する。
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                        { id: "n1", title: "N1", busy: false, dataset: "dsA" }]);
        check("newchat-autoselect",
              curSid === "n1" && pendingNewSelect === null && statusOverride === null);
        // 10g. DS不一致の予約は破棄し、「作成中…」も畳む（自動選択もタイムアウト表示もしない）。
        curSid = "a1"; cur = getState("a1");
        statusOverride = { text: T.newChatPending, until: Date.now() + PENDING_NEW_MS };
        pendingNewSelect = { ds: "dsB", before: new Set(), select: true,
                             deadline: Date.now() + PENDING_NEW_MS };
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                        { id: "n1", title: "N1", busy: false, dataset: "dsA" }]);
        check("newchat-pending-ds-mismatch",
              pendingNewSelect === null && curSid === "a1" && statusOverride === null);
        // 10h. 期限切れの予約は破棄し、ゲストに理由を出す。
        pendingNewSelect = { ds: "dsA", before: new Set(["a1"]), select: true,
                             deadline: Date.now() - 1 };
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                        { id: "n1", title: "N1", busy: false, dataset: "dsA" }]);
        check("newchat-pending-expired",
              pendingNewSelect === null && curSid === "a1" &&
              !!statusOverride && statusOverride.text === T.newChatTimeout);
        // 10i. スナップショットが旧DSのもの（DS切替の応答待ち窓）なら select=false に
        //      落とし、既存セッションを誤選択しない。fresh が既存セッションでありうる
        //      ので「作成中…」は畳まず期限に委ねる。
        curSid = "a1"; cur = getState("a1");
        pendingNewSelect = null; statusOverride = null;
        lastFilteredSids = new Set(["old1"]); lastFilteredDs = "dsOld";
        await newSession();
        const staleSelect = pendingNewSelect && pendingNewSelect.select;
        renderSessions([{ id: "a1", title: "A1", busy: false, dataset: "dsA" },
                        { id: "n1", title: "N1", busy: false, dataset: "dsA" }]);
        check("newchat-stale-snapshot-no-select",
              staleSelect === false && pendingNewSelect === null && curSid === "a1" &&
              !!statusOverride && statusOverride.text === T.newChatPending);
      } finally {
        api = _api; schedulePoll = _sched;
        stopped = _save.stopped; curDs = _save.curDs; curSid = _save.curSid;
        cur = _save.cur; curTab = _save.curTab; myName = _save.myName;
        pendingNewSelect = _save.pendingNewSelect;
        newSessionInflight = _save.newSessionInflight;
        statusOverride = _save.statusOverride;
        lastFilteredSids = _save.lastFilteredSids; lastFilteredDs = _save.lastFilteredDs;
      }
    }
  } finally {
    cfg = _cfgSave;
    api = _apiSave;
  }

  const failed = cases.filter((c) => !c.pass);
  const ok = failed.length === 0;
  for (const c of cases) console.log((c.pass ? "PASS" : "FAIL") + " " + c.name);
  document.body.innerHTML = "";
  const box = document.createElement("div");
  box.style.cssText = "padding:16px;font-family:ui-monospace,monospace;font-size:14px";
  let h = "<h2 style='color:" + (ok ? "#a8d08d" : "#f48771") + "'>selftest: " +
    (ok ? "ALL PASS (" + cases.length + ")" : (failed.length + " FAIL")) + "</h2>";
  for (const c of cases)
    h += "<div style='color:" + (c.pass ? "#a8d08d" : "#f48771") + "'>" +
         (c.pass ? "PASS" : "FAIL") + " " + escapeHtml(c.name) + "</div>";
  box.innerHTML = h;
  document.body.appendChild(box);
}

// ---- bootstrap ----
try {
  const savedName = localStorage.getItem("myanalysis_guest_name");
  const savedTok = localStorage.getItem("myanalysis_guest_token");
  if (savedName) document.getElementById("nameInput").value = savedName;
  if (savedTok) document.getElementById("tokenInput").value = savedTok;
  if (savedName || savedTok) document.getElementById("rememberChk").checked = true;
} catch (e) {}

document.getElementById("joinBtn").onclick = () => {
  join(document.getElementById("tokenInput").value, document.getElementById("nameInput").value);
};
// Deep link: …/#token=<base64url> — トークン欄に事前入力するだけ。
// 入室は必ず Join ボタン経由（トークン・名前が揃っていても自動入室しない）。
// この IIFE は bootstrap より後に置くこと（URL のトークンが復元トークンを上書きする＝URL 勝ち）。
(function () {
  const m = (location.hash || "").match(/#token=([^&]+)/);
  if (!m) return;
  try {
    document.getElementById("tokenInput").value = decodeURIComponent(m[1]);
  } catch (e) { /* 不正な %xx を含む #token= はプリフィルをスキップ（手動貼り付け可） */ }
})();

// #selftest: join せずレンダラの自己テストのみ実行（通常運用＝ハッシュ未指定時は何もしない）。
if (location.hash === "#selftest") runSelfTest();
</script>
</body>
